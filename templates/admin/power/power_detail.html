<!-- Detail Save Confirm Modal -->
<div id="pwr-detail-confirm-modal" class="hidden fixed inset-0 bg-slate-900/40 z-[60] items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-sm px-8 py-8 text-center">
    <p class="text-base font-semibold text-slate-900 mb-1">수정하시겠습니까?</p>
    <p class="text-xs text-slate-500 mb-6">수정한 스마트 전력 시스템 정보를 저장하시겠습니까?</p>
    <div class="flex gap-2">
      <button type="button" id="pwr-detail-confirm-cancel"
        class="flex-1 px-5 py-2 border border-slate-200 bg-white rounded-md text-sm text-slate-700 hover:bg-slate-50 transition-colors">취소</button>
      <button type="button" id="pwr-detail-confirm-ok"
        class="flex-1 px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md transition-colors">확인</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div id="pwr-detail-modal" class="hidden fixed inset-0 bg-slate-900/40 z-50 items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
    <div class="px-8 py-7">

      <div class="mb-5">
        <h3 class="text-xl font-bold text-slate-900 mb-1" id="pwr-detail-title">스마트 전력 시스템</h3>
        <p class="text-xs text-slate-500" id="pwr-detail-subtitle">스마트 전력 시스템의 등록 정보를 확인하고 수정할 수 있습니다.</p>
      </div>

      <div class="flex gap-2 mb-6">
        <button type="button" id="pwr-tab-basic-btn"
          class="px-5 py-2 text-sm font-medium rounded-md transition-colors bg-blue-600 text-white">
          기본 정보
        </button>
        <button type="button" id="pwr-tab-inspect-btn"
          class="px-5 py-2 text-sm font-medium rounded-md transition-colors text-slate-600 hover:bg-slate-100">
          점검 실행 및 이력
        </button>
      </div>

      <!-- 기본 정보 탭 -->
      <div id="pwr-tab-basic">
        <form id="pwr-detail-form" novalidate>
          <div class="space-y-4">

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1.5">장비 유형 <span class="text-red-500">*</span></label>
                <input type="text" disabled value="스마트 전력 시스템"
                  class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1.5">장비코드 <span class="text-red-500">*</span></label>
                <input type="text" id="pwr-detail-device-code" disabled
                  class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 font-mono cursor-not-allowed" />
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1.5">장비명 <span class="text-red-500">*</span></label>
                <input type="text" id="pwr-detail-device-name" maxlength="50"
                  class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent pwr-detail-field" />
                <p class="hidden mt-1 text-[11px] text-red-500" id="pwr-detail-name-error"></p>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1.5">장비 ID(MAC) <span class="text-red-500">*</span></label>
                <input type="text" id="pwr-detail-mac" placeholder="AA:BB:CC:DD:EE:FF"
                  class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400 pwr-detail-field" />
                <p class="hidden mt-1 text-[11px] text-red-500" id="pwr-detail-mac-error"></p>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1.5">관리 부서 <span class="text-red-500">*</span></label>
                <select id="pwr-detail-dept"
                  class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-700 pwr-detail-field">
                  <option value="">부서 선택</option>
                  {% for dept in departments %}
                  <option value="{{ dept.id }}">{{ dept.name }}</option>
                  {% endfor %}
                </select>
                <p class="hidden mt-1 text-[11px] text-red-500" id="pwr-detail-dept-error"></p>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1.5">담당자 <span class="text-red-500">*</span></label>
                <select id="pwr-detail-manager"
                  class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-700 pwr-detail-field">
                  <option value="">담당자 선택</option>
                  {% for user in managers %}
                  <option value="{{ user.id }}">{{ user.name }}</option>
                  {% endfor %}
                </select>
                <p class="hidden mt-1 text-[11px] text-red-500" id="pwr-detail-manager-error"></p>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1.5">연결 설비 <span class="text-red-500">*</span></label>
                <select id="pwr-detail-facility"
                  class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-700 pwr-detail-field">
                  <option value="">연결 설비 선택</option>
                  {% for e in all_equipments %}
                  <option value="{{ e.id }}">{{ e.equipment_name }}</option>
                  {% endfor %}
                </select>
                <p class="hidden mt-1 text-[11px] text-red-500" id="pwr-detail-facility-error"></p>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1.5">사용 여부 <span class="text-red-500">*</span></label>
                <div class="flex items-center gap-5 pt-2">
                  <label class="flex items-center gap-2 cursor-pointer text-sm text-slate-700">
                    <input type="checkbox" id="pwr-detail-status-active"
                      class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 pwr-detail-field" />사용
                  </label>
                  <label class="flex items-center gap-2 cursor-pointer text-sm text-slate-700">
                    <input type="checkbox" id="pwr-detail-status-inactive"
                      class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 pwr-detail-field" />미사용
                  </label>
                </div>
                <p class="hidden mt-1 text-[11px] text-red-500" id="pwr-detail-status-error"></p>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1.5">서버 주소(IP) / PORT <span class="text-red-500">*</span></label>
                <input type="text" id="pwr-detail-ip" placeholder="서버 주소 입력"
                  class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400 mb-2 pwr-detail-field" />
                <input type="text" id="pwr-detail-port" placeholder="PORT 입력"
                  class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400 pwr-detail-field" />
                <p class="hidden mt-1 text-[11px] text-red-500" id="pwr-detail-comm-error"></p>
                <button type="button" id="pwr-detail-conn-check"
                  class="mt-2 px-4 py-2 text-xs font-medium border border-slate-200 rounded-md text-slate-700 hover:bg-slate-50 transition-colors">
                  연결 확인
                </button>
              </div>
              <div class="flex flex-col gap-4">
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1.5">연결 확인 상태 / 마지막 확인일시</label>
                  <div class="flex items-center gap-2 mt-1">
                    <input type="checkbox" id="pwr-detail-conn-verified" disabled
                      class="w-4 h-4 rounded border-slate-300 flex-shrink-0" />
                    <label class="text-xs text-slate-500 flex-shrink-0" id="pwr-detail-conn-label">미확인</label>
                    <input type="text" id="pwr-detail-conn-date" disabled
                      class="flex-1 px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1.5">비고</label>
                  <textarea id="pwr-detail-note" rows="3" placeholder="운영 메모를 입력하세요"
                    class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400 resize-none pwr-detail-field"></textarea>
                </div>
              </div>
            </div>

          </div>

          <div class="flex items-center justify-end gap-2 mt-6">
            <button type="button" id="pwr-detail-cancel"
              class="px-5 py-2 border border-slate-200 bg-white rounded-md text-sm text-slate-700 hover:bg-slate-50 transition-colors">
              취소
            </button>
            <button type="submit" id="pwr-detail-save-btn" disabled
              class="px-5 py-2 rounded-md text-sm font-medium transition-colors bg-slate-200 text-slate-400 cursor-not-allowed">
              수정
            </button>
          </div>
        </form>
      </div>

      <!-- 점검 실행 및 이력 탭 -->
      <div id="pwr-tab-inspect" class="hidden">

        <!-- 장비 요약 -->
        <div class="mb-4">
          <div class="flex items-center justify-between px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg">
            <div class="flex items-center gap-3">
              <span class="px-2 py-0.5 bg-slate-800 text-white text-xs font-bold rounded flex-shrink-0" id="pwr-inspect-device-id"></span>
              <div>
                <p class="text-sm font-medium text-slate-700" id="pwr-inspect-device-info"></p>
                <p class="text-xs text-slate-500 mt-0.5" id="pwr-inspect-manager-info"></p>
              </div>
            </div>
            <button type="button" id="pwr-inspect-register-btn"
              class="flex-shrink-0 px-3 py-1.5 text-xs font-medium border border-slate-300 rounded-md text-slate-700 hover:bg-white transition-colors">
              점검 등록
            </button>
          </div>
        </div>

        <!-- 최근 점검 상태 -->
        <div class="mb-4">
          <h4 class="text-xs font-semibold text-slate-700 mb-2">최근 점검 상태</h4>
          <div class="grid grid-cols-4 gap-3">
            <div class="px-4 py-3 border border-slate-200 rounded-lg">
              <p class="text-[11px] text-slate-400 mb-1">점검 여부</p>
              <p class="text-sm font-semibold text-slate-400" id="pwr-summary-check-status">-</p>
            </div>
            <div class="px-4 py-3 border border-slate-200 rounded-lg">
              <p class="text-[11px] text-slate-400 mb-1">최근 점검일</p>
              <p class="text-sm font-semibold text-slate-700" id="pwr-summary-last-inspected">-</p>
            </div>
            <div class="px-4 py-3 border border-slate-200 rounded-lg">
              <p class="text-[11px] text-slate-400 mb-1">다음 점검 예정일</p>
              <p class="text-sm font-semibold text-slate-700" id="pwr-summary-action-date">-</p>
            </div>
            <div class="px-4 py-3 border border-slate-200 rounded-lg">
              <p class="text-[11px] text-slate-400 mb-1">조치 상태</p>
              <p class="text-sm font-semibold text-slate-400" id="pwr-summary-current-state">-</p>
            </div>
          </div>
        </div>

        <!-- 점검 이력 -->
        <div>
          <h4 class="text-xs font-semibold text-slate-700 mb-2">점검 이력</h4>
          <div class="overflow-x-auto overflow-y-auto max-h-52 rounded-lg border border-slate-200">
            <table class="w-full text-xs">
              <thead class="sticky top-0 z-10">
                <tr class="bg-slate-50 border-b border-slate-100">
                  <th class="text-left px-3 py-2.5 font-medium text-slate-500 whitespace-nowrap">점검 구분</th>
                  <th class="text-left px-3 py-2.5 font-medium text-slate-500 whitespace-nowrap">조치 여부</th>
                  <th class="text-left px-3 py-2.5 font-medium text-slate-500 whitespace-nowrap">점검일</th>
                  <th class="text-left px-3 py-2.5 font-medium text-slate-500 whitespace-nowrap">점검자</th>
                  <th class="text-left px-3 py-2.5 font-medium text-slate-500 whitespace-nowrap">조치 담당자</th>
                  <th class="text-left px-3 py-2.5 font-medium text-slate-500">점검/조치 내용</th>
                </tr>
              </thead>
              <tbody id="pwr-inspect-history-tbody">
                <tr>
                  <td colspan="6" class="px-3 py-4 text-center text-slate-400 text-xs">점검 이력을 불러오는 중...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="flex justify-end mt-6">
          <button type="button" id="pwr-inspect-tab-confirm"
            class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md transition-colors">
            확인
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
<script>
(function() {
  var detailModal  = document.getElementById('pwr-detail-modal');
  var confirmModal = document.getElementById('pwr-detail-confirm-modal');
  var saveBtn      = document.getElementById('pwr-detail-save-btn');
  var commChecked  = true;
  var ipAtOpen     = '';
  var portAtOpen   = '';
  var isDirty      = false;

  var TAB_SUBTITLES = {
    basic:   '스마트 전력 시스템의 등록 정보를 확인하고 수정할 수 있습니다.',
    inspect: '스마트 전력 시스템 점검 상태를 확인하고 이력을 조회하거나 점검을 등록할 수 있습니다.'
  };

  function activateTab(name) {
    var isBasic = (name === 'basic');
    document.getElementById('pwr-tab-basic-btn').className   = 'px-5 py-2 text-sm font-medium rounded-md transition-colors ' + (isBasic  ? 'bg-blue-600 text-white' : 'text-slate-600 hover:bg-slate-100');
    document.getElementById('pwr-tab-inspect-btn').className = 'px-5 py-2 text-sm font-medium rounded-md transition-colors ' + (!isBasic ? 'bg-blue-600 text-white' : 'text-slate-600 hover:bg-slate-100');
    document.getElementById('pwr-tab-basic').classList.toggle('hidden', !isBasic);
    document.getElementById('pwr-tab-inspect').classList.toggle('hidden', isBasic);
    document.getElementById('pwr-detail-subtitle').textContent = TAB_SUBTITLES[name];
  }
  document.getElementById('pwr-tab-basic-btn')?.addEventListener('click', function() { activateTab('basic'); });
  document.getElementById('pwr-tab-inspect-btn')?.addEventListener('click', function() {
    activateTab('inspect');
    loadInspectionHistory();
  });

  function setDirty() {
    if (isDirty) return;
    isDirty = true;
    saveBtn.disabled = false;
    saveBtn.className = 'px-5 py-2 rounded-md text-sm font-medium transition-colors bg-blue-600 hover:bg-blue-700 text-white cursor-pointer';
  }
  function resetDirty() {
    isDirty = false;
    saveBtn.disabled = true;
    saveBtn.className = 'px-5 py-2 rounded-md text-sm font-medium transition-colors bg-slate-200 text-slate-400 cursor-not-allowed';
  }

  document.getElementById('pwr-detail-form')?.addEventListener('input',  setDirty);
  document.getElementById('pwr-detail-form')?.addEventListener('change', setDirty);

  window.openPwrDetailModal = function(data) {
    var mac  = data.mac  || '';
    var note = data.note || '';

    document.getElementById('pwr-detail-title').textContent        = '스마트 전력 시스템 ' + (data.deviceId || '');
    document.getElementById('pwr-detail-device-code').value        = data.deviceId   || '';
    document.getElementById('pwr-detail-device-name').value        = data.deviceName || '';
    document.getElementById('pwr-detail-mac').value                = mac;
    document.getElementById('pwr-detail-dept').value               = data.dept       || '';
    document.getElementById('pwr-detail-manager').value            = data.manager    || '';
    document.getElementById('pwr-detail-facility').value           = data.equipment  || '';
    document.getElementById('pwr-detail-ip').value                 = data.ip         || '';
    document.getElementById('pwr-detail-port').value               = data.port       || '';
    document.getElementById('pwr-detail-status-active').checked    = (data.status !== 'inactive');
    document.getElementById('pwr-detail-status-inactive').checked  = (data.status === 'inactive');
    document.getElementById('pwr-detail-conn-verified').checked    = (data.connVerified === 'true');
    document.getElementById('pwr-detail-conn-label').textContent   = (data.connVerified === 'true') ? '정상' : '미확인';
    document.getElementById('pwr-detail-conn-date').value          = data.connDate   || '';
    document.getElementById('pwr-detail-note').value               = note;

    // 점검 탭 장비 요약
    document.getElementById('pwr-inspect-device-id').textContent   = data.deviceId || '';
    document.getElementById('pwr-inspect-device-info').textContent = '스마트 전력 시스템' + (mac ? ' · MAC: ' + mac : '');
    document.getElementById('pwr-inspect-manager-info').textContent =
      '연결 설비: ' + (data.equipmentName || '—') + ' / 담당자: ' + (data.managerName || '—');

    window.currentPwrData = data;
    ipAtOpen    = data.ip   || '';
    portAtOpen  = data.port || '';
    commChecked = true;

    clearAllErrors();
    resetDirty();
    activateTab('basic');
    detailModal.classList.remove('hidden');
    detailModal.classList.add('flex');
    lucide.createIcons();
  };

  function loadInspectionHistory() {
    var data = window.currentPwrData || {};
    var dbId = data.id;
    if (!dbId) {
      document.getElementById('pwr-inspect-history-tbody').innerHTML =
        '<tr><td colspan="6" class="px-3 py-4 text-center text-slate-400 text-xs">장비 정보를 찾을 수 없습니다.</td></tr>';
      return;
    }
    document.getElementById('pwr-inspect-history-tbody').innerHTML =
      '<tr><td colspan="6" class="px-3 py-4 text-center text-slate-400 text-xs">점검 이력을 불러오는 중...</td></tr>';

    fetch('/manager/power/' + dbId + '/inspections/')
      .then(function(r) { return r.json(); })
      .then(function(resp) {
        if (!resp.ok) return;

        // 최근 점검 상태 요약
        if (resp.summary) {
          var s = resp.summary;
          var checkEl = document.getElementById('pwr-summary-check-status');
          checkEl.textContent = s.check_status;
          checkEl.className = 'text-sm font-semibold ' +
            (s.check_status === '점검 필요' ? 'text-red-600' : 'text-green-600');
          document.getElementById('pwr-summary-last-inspected').textContent = s.last_inspected;
          document.getElementById('pwr-summary-action-date').textContent    = s.expected_action_date;
          var stateEl = document.getElementById('pwr-summary-current-state');
          stateEl.textContent = s.current_state || '—';
          stateEl.className = 'text-sm font-semibold ' + (s.current_state === '조치 필요' ? 'text-red-600' : 'text-green-600');

          // 목록 행 점검 상태·최근 점검일 업데이트
          var listRow = document.querySelector('tr.pwr-row[data-id="' + dbId + '"]');
          if (listRow) {
            var inspStatusTd = listRow.querySelector('td:nth-child(6)');
            if (inspStatusTd) {
              var badge = '';
              if (s.check_status === '점검 완료') {
                badge = '<span class="px-2 py-0.5 text-xs font-medium rounded bg-green-50 text-green-600">점검 완료</span>';
              } else if (s.check_status === '점검 필요') {
                badge = '<span class="px-2 py-0.5 text-xs font-medium rounded bg-red-50 text-red-500">점검 필요</span>';
              }
              if (badge) inspStatusTd.innerHTML = badge;
            }
            var lastInspTd = listRow.querySelector('td:nth-child(8)');
            if (lastInspTd && s.last_inspected && s.last_inspected !== '-') {
              lastInspTd.textContent = s.last_inspected;
            }
          }
        } else {
          ['pwr-summary-check-status','pwr-summary-last-inspected','pwr-summary-action-date','pwr-summary-current-state'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) { el.textContent = '-'; el.className = 'text-sm font-semibold text-slate-400'; }
          });
        }

        // 점검 이력 테이블 렌더링
        var tbody = document.getElementById('pwr-inspect-history-tbody');
        if (!resp.inspections.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="px-3 py-4 text-center text-slate-400 text-xs">점검 이력이 없습니다.</td></tr>';
          return;
        }
        tbody.innerHTML = resp.inspections.map(function(insp) {
          // 점검 구분 배지
          var typeBadge = insp.type_code === 'regular'
            ? '<span class="px-1.5 py-0.5 bg-blue-50 text-blue-700 rounded text-[11px] font-medium">정기</span>'
            : '<span class="px-1.5 py-0.5 bg-red-50 text-red-700 rounded text-[11px] font-medium">이상</span>';

          // 조치 여부 배지 (column 2)
          var actionBadge;
          if (insp.status === 'normal') {
            actionBadge = '<span class="text-slate-400">—</span>';
          } else if (insp.has_action) {
            actionBadge = '<span class="px-1.5 py-0.5 bg-emerald-50 text-emerald-700 rounded text-[11px] font-medium">조치 완료</span>';
          } else {
            actionBadge = '<span class="px-1.5 py-0.5 bg-red-50 text-red-600 rounded text-[11px] font-medium">조치 필요</span>';
          }

          // 조치 담당자 / 조치 등록 버튼 (column 5)
          var actorCell;
          if (insp.has_action && insp.action) {
            actorCell = '<span class="text-slate-600">' + (insp.action.actor || '—') + '</span>';
          } else if (insp.status !== 'normal') {
            actorCell =
              '<button type="button" class="pwr-action-trigger text-xs text-blue-600 hover:text-blue-800 font-medium transition-colors"' +
              ' data-inspect-id="' + insp.id + '"' +
              ' data-inspect-type="' + insp.type_code + '"' +
              ' data-inspect-date="' + insp.date.replace(/-/g, '.') + '"' +
              ' data-inspect-person="' + (insp.inspector || '') + '"' +
              ' data-inspect-note="' + (insp.note || '').replace(/"/g, '&quot;') + '">조치 등록</button>';
          } else {
            actorCell = '<span class="text-slate-400">—</span>';
          }

          // 점검/조치 내용
          var contentHtml = insp.note ? '<span class="text-slate-600">' + insp.note + '</span>' : '';
          if (insp.action && insp.action.note) {
            contentHtml += (contentHtml ? '<span class="text-slate-300 mx-1">·</span>' : '') +
              '<span class="text-emerald-600">' + insp.action.note + '</span>';
          }

          return '<tr class="border-t border-slate-100 hover:bg-slate-50 transition-colors">' +
            '<td class="px-3 py-2.5">' + typeBadge + '</td>' +
            '<td class="px-3 py-2.5">' + actionBadge + '</td>' +
            '<td class="px-3 py-2.5 text-slate-600 whitespace-nowrap">' + insp.date + '</td>' +
            '<td class="px-3 py-2.5 text-slate-600 whitespace-nowrap">' + (insp.inspector || '—') + '</td>' +
            '<td class="px-3 py-2.5 whitespace-nowrap">' + actorCell + '</td>' +
            '<td class="px-3 py-2.5 text-xs">' + (contentHtml || '<span class="text-slate-300">—</span>') + '</td>' +
            '</tr>';
        }).join('');

        // 조치 등록 버튼 이벤트 연결
        tbody.querySelectorAll('.pwr-action-trigger').forEach(function(btn) {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (typeof window.openPwrActionRegister === 'function') {
              window.openPwrActionRegister({
                id:     btn.dataset.inspectId,
                type:   btn.dataset.inspectType,
                date:   btn.dataset.inspectDate,
                person: btn.dataset.inspectPerson,
                note:   btn.dataset.inspectNote,
              });
            }
          });
        });
      })
      .catch(function() {
        document.getElementById('pwr-inspect-history-tbody').innerHTML =
          '<tr><td colspan="6" class="px-3 py-4 text-center text-slate-400 text-xs">이력을 불러오지 못했습니다.</td></tr>';
      });
  }

  window.loadPwrInspectionHistory = loadInspectionHistory;

  function closeDetailModal() {
    detailModal.classList.add('hidden');
    detailModal.classList.remove('flex');
  }

  function clearAllErrors() {
    ['pwr-detail-name-error','pwr-detail-mac-error','pwr-detail-dept-error','pwr-detail-manager-error','pwr-detail-facility-error','pwr-detail-comm-error','pwr-detail-status-error'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) { el.textContent = ''; el.classList.add('hidden'); }
    });
    ['pwr-detail-ip','pwr-detail-port','pwr-detail-mac','pwr-detail-device-name'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) { el.classList.remove('border-red-400'); el.classList.add('border-slate-200'); }
    });
  }
  function showError(errId, msg, fieldId) {
    var e = document.getElementById(errId);
    if (e) { e.textContent = msg; e.classList.remove('hidden'); }
    if (fieldId) { var f = document.getElementById(fieldId); if (f) { f.classList.add('border-red-400'); f.classList.remove('border-slate-200'); } }
  }
  function hideError(errId, fieldId) {
    var e = document.getElementById(errId);
    if (e) { e.textContent = ''; e.classList.add('hidden'); }
    if (fieldId) { var f = document.getElementById(fieldId); if (f) { f.classList.remove('border-red-400'); f.classList.add('border-slate-200'); } }
  }

  function validate() {
    clearAllErrors();
    var valid = true;
    var deviceName = document.getElementById('pwr-detail-device-name').value.trim();
    if (!deviceName) {
      showError('pwr-detail-name-error', '장비명을 입력해 주세요.', 'pwr-detail-device-name'); valid = false;
    } else if (deviceName.length > 50) {
      showError('pwr-detail-name-error', '장비명은 50자 이내로 입력해 주세요.', 'pwr-detail-device-name'); valid = false;
    }
    var mac = document.getElementById('pwr-detail-mac').value.trim();
    if (!mac) {
      showError('pwr-detail-mac-error', '장비 ID를 입력해 주세요.', 'pwr-detail-mac'); valid = false;
    } else if (!/^([0-9A-Fa-f]{2}[:\-]){5}[0-9A-Fa-f]{2}$/.test(mac)) {
      showError('pwr-detail-mac-error', '장비 ID 형식이 올바르지 않습니다.', 'pwr-detail-mac'); valid = false;
    }
    if (!document.getElementById('pwr-detail-dept').value) {
      showError('pwr-detail-dept-error', '관리 부서를 선택해 주세요.'); valid = false;
    }
    if (!document.getElementById('pwr-detail-manager').value) {
      showError('pwr-detail-manager-error', '관리 담당자를 선택해 주세요.'); valid = false;
    }
    if (!document.getElementById('pwr-detail-facility').value) {
      showError('pwr-detail-facility-error', '연결 설비를 선택해 주세요.'); valid = false;
    }
    var ip   = document.getElementById('pwr-detail-ip').value.trim();
    var port = document.getElementById('pwr-detail-port').value.trim();
    if (!ip) {
      showError('pwr-detail-comm-error', 'IP 주소를 입력해 주세요.', 'pwr-detail-ip'); valid = false;
    } else if (!port) {
      showError('pwr-detail-comm-error', '포트 번호를 입력해 주세요.', 'pwr-detail-port'); valid = false;
    }
    var cbActive   = document.getElementById('pwr-detail-status-active');
    var cbInactive = document.getElementById('pwr-detail-status-inactive');
    if (!cbActive.checked && !cbInactive.checked) {
      showError('pwr-detail-status-error', '사용 여부를 선택해 주세요.'); valid = false;
    }
    if (valid && !commChecked) {
      showError('pwr-detail-comm-error', '연결 확인이 필요합니다. 연결 확인 버튼을 눌러 주세요.'); valid = false;
    }
    return valid;
  }

  document.getElementById('pwr-detail-cancel')?.addEventListener('click', closeDetailModal);
  document.getElementById('pwr-inspect-tab-confirm')?.addEventListener('click', closeDetailModal);

  document.getElementById('pwr-inspect-register-btn')?.addEventListener('click', function() {
    if (typeof window.openPwrInspectRegister === 'function') window.openPwrInspectRegister();
  });

  var cbActive   = document.getElementById('pwr-detail-status-active');
  var cbInactive = document.getElementById('pwr-detail-status-inactive');
  cbActive?.addEventListener('change',   function() { if (cbActive.checked)   cbInactive.checked = false; });
  cbInactive?.addEventListener('change', function() { if (cbInactive.checked) cbActive.checked   = false; });

  document.getElementById('pwr-detail-conn-check')?.addEventListener('click', function() {
    var btn  = this;
    var ip   = document.getElementById('pwr-detail-ip').value.trim();
    var port = document.getElementById('pwr-detail-port').value.trim();
    var mac  = document.getElementById('pwr-detail-mac').value.trim();

    if (!ip) { showError('pwr-detail-comm-error', 'IP 주소를 입력해 주세요.', 'pwr-detail-ip'); return; }
    var ipRegex = /^(\d{1,3}\.){3}\d{1,3}$/;
    if (!ipRegex.test(ip) || ip.split('.').some(function(n) { return parseInt(n) > 255; })) {
      showError('pwr-detail-comm-error', 'IP 주소 형식이 올바르지 않습니다.', 'pwr-detail-ip'); return;
    }
    hideError('pwr-detail-comm-error', 'pwr-detail-ip');
    if (!port) { showError('pwr-detail-comm-error', '포트 번호를 입력해 주세요.', 'pwr-detail-port'); return; }
    if (!/^\d+$/.test(port)) { showError('pwr-detail-comm-error', '포트 번호 형식이 올바르지 않습니다.', 'pwr-detail-port'); return; }
    var pn = parseInt(port);
    if (pn < 1 || pn > 65535) { showError('pwr-detail-comm-error', '포트 번호는 1~65535 범위로 입력해 주세요.', 'pwr-detail-port'); return; }
    hideError('pwr-detail-comm-error', 'pwr-detail-port');

    btn.disabled = true;
    btn.textContent = '확인 중...';

    var fd = new FormData();
    fd.append('ip', ip);
    fd.append('port', port);
    fd.append('mac', mac);

    fetch('{% url "power_comm_check" %}', {
      method: 'POST',
      headers: { 'X-CSRFToken': PWR.getCsrfToken() },
      body: fd,
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      btn.disabled = false;
      btn.textContent = '연결 확인';
      if (data.ok) {
        commChecked = true;
        document.getElementById('pwr-detail-conn-verified').checked = true;
        document.getElementById('pwr-detail-conn-label').textContent = '정상';
        document.getElementById('pwr-detail-conn-date').value = data.checked_at || '';
        hideError('pwr-detail-comm-error');
        setDirty();
      } else if (data.mac_mismatch) {
        commChecked = false;
        showError('pwr-detail-comm-error', '입력한 장비 ID와 실제 응답 장비 정보가 일치하지 않습니다.');
      } else {
        commChecked = false;
        showError('pwr-detail-comm-error', data.error || '장비와 연결할 수 없습니다. 통신 정보를 확인해 주세요.');
      }
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = '연결 확인';
      commChecked = false;
      showError('pwr-detail-comm-error', '장비 응답이 없습니다. 전원 및 상태를 확인해 주세요.');
    });
  });

  ['pwr-detail-ip','pwr-detail-port'].forEach(function(id) {
    document.getElementById(id)?.addEventListener('input', function() {
      var curIp   = document.getElementById('pwr-detail-ip').value.trim();
      var curPort = document.getElementById('pwr-detail-port').value.trim();
      commChecked = (curIp === ipAtOpen && curPort === portAtOpen);
      if (!commChecked) {
        document.getElementById('pwr-detail-conn-verified').checked = false;
        document.getElementById('pwr-detail-conn-label').textContent = '미확인';
        document.getElementById('pwr-detail-conn-date').value = '';
      }
    });
  });

  document.getElementById('pwr-detail-form')?.addEventListener('submit', function(e) {
    e.preventDefault();
    if (!validate()) return;
    confirmModal.classList.remove('hidden');
    confirmModal.classList.add('flex');
  });

  document.getElementById('pwr-detail-confirm-cancel')?.addEventListener('click', function() {
    confirmModal.classList.add('hidden');
    confirmModal.classList.remove('flex');
  });

  document.getElementById('pwr-detail-confirm-ok')?.addEventListener('click', function() {
    confirmModal.classList.add('hidden');
    confirmModal.classList.remove('flex');

    var data = window.currentPwrData || {};
    var dbId = data.id;
    if (!dbId) return;

    var fd = new FormData();
    fd.append('csrfmiddlewaretoken', PWR.getCsrfToken());
    fd.append('device_name', document.getElementById('pwr-detail-device-name').value.trim());
    fd.append('device_mac',  document.getElementById('pwr-detail-mac').value.trim());
    fd.append('department',  document.getElementById('pwr-detail-dept').value);
    fd.append('manager',     document.getElementById('pwr-detail-manager').value);
    fd.append('equipment',   document.getElementById('pwr-detail-facility').value);
    fd.append('ip',          document.getElementById('pwr-detail-ip').value.trim());
    fd.append('port',        document.getElementById('pwr-detail-port').value.trim());
    fd.append('is_active',   document.getElementById('pwr-detail-status-active').checked ? 'true' : 'false');
    fd.append('note',        document.getElementById('pwr-detail-note').value.trim());

    fetch('/manager/power/' + dbId + '/edit/', {
      method:  'POST',
      headers: { 'X-CSRFToken': PWR.getCsrfToken() },
      body:    fd,
    })
    .then(function(r) { return r.json(); })
    .then(function(resp) {
      if (!resp.ok) { alert(resp.error || '수정에 실패했습니다.'); return; }
      closeDetailModal();
      PWR.showSuccess('수정되었습니다.', '장비 정보가 수정되었습니다.');
    })
    .catch(function() { alert('서버 오류가 발생했습니다.'); });
  });
})();
</script>
