<!-- Inspect Register Modal -->

  <div class="bg-white rounded-xl shadow-xl w-full max-w-xl max-h-[90vh] overflow-y-auto">

      <p class="text-xs text-slate-500 mt-1" id="pir-subtitle">해당 장비의 점검 결과를 등록합니다.</p>
    </div>

    <div class="px-8 py-6 space-y-5">

      <!-- 점검 대상 -->
      <div>
        <p class="text-xs font-semibold text-slate-700 mb-2">점검 대상</p>
        <div class="flex items-center justify-between px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="px-2 py-0.5 bg-slate-800 text-white text-xs font-bold rounded" id="pir-device-id"></span>
              <span class="text-sm text-slate-700" id="pir-device-info"></span>
            </div>
            <p class="text-xs text-slate-500" id="pir-manager-info"></p>
          </div>
          <span id="pir-status-badge" class="text-xs font-medium flex-shrink-0 ml-3"></span>
        </div>
      </div>

      <!-- 점검 기본 정보 -->
      <div>
        <p class="text-xs font-semibold text-slate-700 mb-3">점검 기본 정보</p>
        <div class="space-y-4">

          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">점검 구분 <span class="text-red-500">*</span></label>
              <select id="pir-type"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-700">
                <option value="">점검 구분</option>
                <option value="regular">정기 점검</option>
                <option value="abnormal">이상 점검</option>
              </select>
              <p class="hidden mt-1 text-[11px] text-red-500" id="pir-type-error">점검 구분을 선택해주세요.</p>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">점검일 <span class="text-red-500">*</span></label>
              <input type="text" id="pir-date" disabled
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">점검자</label>
              <input type="text" id="pir-inspector" disabled
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
            </div>
          </div>

          <!-- 점검 상태 + 예상 조치일 -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">점검 상태 <span class="text-red-500">*</span></label>
              <select id="pir-status"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-700">
                <option value="">점검 상태</option>
                <option value="normal">정상</option>

              </select>
              <p class="hidden mt-1 text-[11px] text-red-500" id="pir-status-error">점검 상태를 선택해주세요.</p>
            </div>
            <!-- 예상 조치일: 정기 점검 + 조치 필요 선택 시만 표시 -->
            <div id="pir-expected-date-wrap" class="hidden">
              <label class="block text-xs font-medium text-slate-700 mb-1.5">예상 조치일 <span class="text-red-500">*</span></label>
              <input type="text" id="pir-expected-date" placeholder="YYYY.MM.DD"

            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1.5">
              점검 메모 <span id="pir-note-asterisk" class="hidden text-red-500">*</span>

        <p class="text-xs font-semibold text-slate-700 mb-3">조치 정보</p>
        <div class="space-y-4">

          <div class="grid grid-cols-2 gap-3">
            <div>

              <p class="hidden mt-1 text-[11px] text-red-500" id="pir-action-complete-date-error">조치 완료일을 입력해주세요.</p>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">조치자</label>
              <input type="text" id="pir-action-person" disabled
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1.5">조치 의견 <span class="text-red-500">*</span></label>
            <textarea id="pir-action-opinion" rows="3" placeholder="해당 점검 조치 내용을 입력해 주세요"
              class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400 resize-none"></textarea>
            <p class="hidden mt-1 text-[11px] text-red-500" id="pir-action-opinion-error">조치 의견을 입력해주세요.</p>
          </div>

        </div>
      </div>

    </div>

    <div class="px-8 py-4 border-t border-slate-100 flex justify-end gap-2 sticky bottom-0 bg-white">
      <button type="button" id="pir-cancel"
        class="px-5 py-2 border border-slate-200 bg-white rounded-md text-sm text-slate-700 hover:bg-slate-50 transition-colors">
        취소
      </button>
      <button type="button" id="pir-submit" disabled
        class="px-5 py-2 bg-slate-200 text-slate-400 text-sm font-medium rounded-md cursor-not-allowed">
        저장
      </button>
    </div>

  </div>
</div>

  <div class="bg-white rounded-xl shadow-xl w-full max-w-xl max-h-[90vh] overflow-y-auto">

            <span class="px-2 py-0.5 bg-slate-800 text-white text-xs font-bold rounded flex-shrink-0" id="par-device-id"></span>

      <!-- 조치 정보 -->

            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">조치 완료일</label>
              <input type="text" id="par-action-date" disabled
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />

<script>
(function() {
  var inspectModal   = document.getElementById('pwr-inspect-register-modal');
  var inspectConfirm = document.getElementById('pir-save-confirm-modal');

  var SUBTITLES = {
    regular_normal: '스마트 전력 시스템의 정기 점검 결과를 등록합니다.',
    regular_action: '정기 점검 중 발견된 조치 필요 사항을 함께 등록합니다.',
    abnormal:       '이상 점검 결과와 후속 조치 정보를 등록합니다.'
  };

  var CONFIRM_TEXTS = {
    regular_normal: '점검 결과를 저장하시겠습니까?',
    regular_action: '점검 결과 및 조치 예정 정보를 저장하시겠습니까?',
    abnormal:       '이상 점검 결과 및 조치 정보를 저장하시겠습니까?'
  };

  var NOTE_PLACEHOLDERS = {
    regular:  '점검 결과 및 특이사항을 입력해 주세요',
    abnormal: '조치 필요 이상 상태를 입력해 주세요'
  };

  var STATUS_OPTS = {
    regular:  [['normal','정상'],['action_required','조치 필요']],
    abnormal: [['action_required','조치 필요'],['done','조치 완료']]
  };

  var STATUS_BADGE_CFG = {
    normal:          { text: '● 정상',      cls: 'text-xs font-medium text-blue-600' },
    action_required: { text: '● 조치 필요', cls: 'text-xs font-medium text-red-500' },
    done:            { text: '● 조치 완료', cls: 'text-xs font-medium text-emerald-600' }
  };

  function getModeKey() {
    var typeVal   = document.getElementById('pir-type').value;
    var statusVal = document.getElementById('pir-status').value;
    if (typeVal === 'abnormal') return 'abnormal';
    if (statusVal === 'action_required') return 'regular_action';
    return 'regular_normal';
  }

  function updateStatusBadge(statusVal) {
    var badge = document.getElementById('pir-status-badge');
    var cfg   = STATUS_BADGE_CFG[statusVal];
    if (cfg) {
      badge.textContent = cfg.text;
      badge.className   = cfg.cls + ' flex-shrink-0 ml-3';
    } else {
      badge.textContent = '';
      badge.className   = 'flex-shrink-0 ml-3';
    }
  }

  function updateStatusOptions(typeVal) {
    var select = document.getElementById('pir-status');
    var opts   = STATUS_OPTS[typeVal] || STATUS_OPTS['regular'];
    var prev   = select.value;
    select.innerHTML = '<option value="">점검 상태</option>';
    opts.forEach(function(o) {
      var opt = document.createElement('option');
      opt.value       = o[0];
      opt.textContent = o[1];
      select.appendChild(opt);
    });
    var stillValid = opts.some(function(o) { return o[0] === prev; });
    select.value = stillValid ? prev : '';
  }

  function checkSaveBtn() {
    var typeVal   = document.getElementById('pir-type').value;
    var statusVal = document.getElementById('pir-status').value;
    var isAbnormal     = (typeVal === 'abnormal');
    var isActionNeeded = (statusVal === 'action_required');

    var ok = !!typeVal && !!statusVal;

    if (ok && isActionNeeded) {
      ok = !!document.getElementById('pir-expected-date').value.trim();
    }
    if (ok && (isActionNeeded || isAbnormal)) {
      ok = !!document.getElementById('pir-note').value.trim();
    }

    var btn = document.getElementById('pir-submit');
    btn.disabled  = !ok;
    btn.className = ok
      ? 'px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md transition-colors'
      : 'px-5 py-2 bg-slate-200 text-slate-400 text-sm font-medium rounded-md cursor-not-allowed';
  }

  function refreshUI() {
    var typeVal   = document.getElementById('pir-type').value;
    var statusVal = document.getElementById('pir-status').value;
    var isAbnormal     = (typeVal === 'abnormal');
    var isActionNeeded = (statusVal === 'action_required');

    document.getElementById('pir-subtitle').textContent = SUBTITLES[getModeKey()] || '해당 장비의 점검 결과를 등록합니다.';
    document.getElementById('pir-note').placeholder     = NOTE_PLACEHOLDERS[isAbnormal ? 'abnormal' : 'regular'];
    document.getElementById('pir-note-asterisk').classList.toggle('hidden', !isActionNeeded && !isAbnormal);
    document.getElementById('pir-expected-date-wrap').classList.toggle('hidden', !isActionNeeded);
    document.getElementById('pir-action-section').classList.add('hidden');

    updateStatusBadge(statusVal);
    checkSaveBtn();
  }

  document.getElementById('pir-type')?.addEventListener('change', function() {
    updateStatusOptions(this.value);
    refreshUI();
  });
  document.getElementById('pir-status')?.addEventListener('change', refreshUI);
  document.getElementById('pir-expected-date')?.addEventListener('input', checkSaveBtn);
  document.getElementById('pir-note')?.addEventListener('input', checkSaveBtn);
  document.getElementById('pir-action-complete-date')?.addEventListener('input', checkSaveBtn);
  document.getElementById('pir-action-opinion')?.addEventListener('input', checkSaveBtn);

  function clearPirErrors() {
    ['pir-type-error','pir-status-error','pir-expected-date-error',
     'pir-action-complete-date-error','pir-action-opinion-error','pir-note-error'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    });
  }

  function showPirError(errId, msg) {
    var e = document.getElementById(errId);
    if (e) { e.textContent = msg; e.classList.remove('hidden'); }
  }

  function parsePirDate(str) {
    var p = str.split('.');
    if (p.length !== 3) return null;
    var y = parseInt(p[0]), m = parseInt(p[1]), d = parseInt(p[2]);
    var dt = new Date(y, m - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() + 1 !== m || dt.getDate() !== d) return null;
    return dt;
  }

  function validatePir() {
    clearPirErrors();
    var valid      = true;
    var typeVal    = document.getElementById('pir-type').value;
    var statusVal  = document.getElementById('pir-status').value;
    var isAbnormal     = (typeVal === 'abnormal');
    var isActionNeeded = (statusVal === 'action_required');

    if (!typeVal) {
      showPirError('pir-type-error', '점검 구분을 선택해주세요.'); valid = false;
    }
    if (!statusVal) {
      showPirError('pir-status-error', '점검 상태를 선택해주세요.'); valid = false;
    }
    if (isActionNeeded) {
      var expectedStr = document.getElementById('pir-expected-date').value.trim();
      if (!expectedStr) {
        showPirError('pir-expected-date-error', '예상 조치일을 입력해주세요.'); valid = false;
      } else if (!/^\d{4}\.\d{2}\.\d{2}$/.test(expectedStr)) {
        showPirError('pir-expected-date-error', '예상 조치일은 YYYY.MM.DD 형식으로 입력해 주세요.'); valid = false;
      } else if (!parsePirDate(expectedStr)) {
        showPirError('pir-expected-date-error', '올바른 날짜를 입력해 주세요.'); valid = false;
      }
    }
    if (isActionNeeded || isAbnormal) {
      if (!document.getElementById('pir-note').value.trim()) {
        showPirError('pir-note-error', '점검 메모를 입력해주세요.'); valid = false;
      }
    }
    return valid;
  }

  window.openPwrInspectRegister = function() {
    var data        = window.currentPwrData || {};
    var managerName = data.managerName || PWR.resolveManager(data.manager);

    document.getElementById('pir-device-id').textContent    = data.deviceId || '';
    document.getElementById('pir-device-info').textContent  = '스마트 전력 시스템' + (data.mac ? ' · MAC: ' + data.mac : '');
    document.getElementById('pir-manager-info').textContent = '연결 설비: ' + (data.equipmentName || '—') + ' / 담당자: ' + managerName;

    document.getElementById('pir-type').value                 = '';
    document.getElementById('pir-date').value                 = PWR.todayStr();
    document.getElementById('pir-inspector').value            = '{{ request.user.name }}';
    document.getElementById('pir-expected-date').value        = '';
    document.getElementById('pir-action-complete-date').value = PWR.todayStr();
    document.getElementById('pir-action-person').value        = '{{ request.user.name }}';
    document.getElementById('pir-action-opinion').value       = '';
    document.getElementById('pir-note').value                 = '';

    updateStatusOptions('regular');
    document.getElementById('pir-status').value = '';
    document.getElementById('pir-status-badge').textContent = '';
    clearPirErrors();
    refreshUI();
    inspectModal.classList.remove('hidden');
    inspectModal.classList.add('flex');
  };

  function closePwrInspectRegister() {
    inspectModal.classList.add('hidden');
    inspectModal.classList.remove('flex');
  }

  document.getElementById('pir-cancel')?.addEventListener('click', closePwrInspectRegister);

  document.getElementById('pir-submit')?.addEventListener('click', function() {
    if (!validatePir()) return;
    document.getElementById('pir-confirm-text').textContent = CONFIRM_TEXTS[getModeKey()];
    inspectConfirm.classList.remove('hidden');
    inspectConfirm.classList.add('flex');
  });

  document.getElementById('pir-save-confirm-cancel')?.addEventListener('click', function() {
    inspectConfirm.classList.add('hidden');
    inspectConfirm.classList.remove('flex');
  });

  document.getElementById('pir-save-confirm-ok')?.addEventListener('click', function() {
    inspectConfirm.classList.add('hidden');
    inspectConfirm.classList.remove('flex');

    var pData = window.currentPwrData || {};
    var fd    = new FormData();
    fd.append('csrfmiddlewaretoken',  PWR.getCsrfToken());
    fd.append('device_id',            pData.id || '');
    fd.append('inspect_type',         document.getElementById('pir-type').value);
    fd.append('inspect_date',         document.getElementById('pir-date').value);
    fd.append('inspector',            document.getElementById('pir-inspector').value.trim());
    fd.append('status',               document.getElementById('pir-status').value);
    fd.append('expected_action_date', document.getElementById('pir-expected-date').value || '');
    fd.append('note',                 document.getElementById('pir-note').value.trim());

    fetch('/manager/power/inspect/create/', {
      method:  'POST',
      headers: { 'X-CSRFToken': PWR.getCsrfToken() },
      body:    fd,
    })
    .then(function(r) { return r.json(); })
    .then(function(resp) {
      if (!resp.ok) { alert(resp.error || '저장에 실패했습니다.'); return; }
      closePwrInspectRegister();
      PWR.showSuccess('저장되었습니다.', '점검 결과가 등록되었습니다.');
      if (typeof window.loadPwrInspectionHistory === 'function') {
        window.loadPwrInspectionHistory();
      }
    })
    .catch(function() { alert('서버 오류가 발생했습니다.'); });
  });

  // ── 조치 등록 ──────────────────────────────────────────────────
  var actionModal = document.getElementById('pwr-action-register-modal');

  window.openPwrActionRegister = function(inspectData) {
    var data        = window.currentPwrData || {};
    var managerName = data.managerName || PWR.resolveManager(data.manager);

    actionModal.dataset.inspectId = inspectData.id || '';

    document.getElementById('par-device-id').textContent    = data.deviceId || '';
    document.getElementById('par-device-info').textContent  = '스마트 전력 시스템' + (data.mac ? ' · MAC: ' + data.mac : '');
    document.getElementById('par-manager-info').textContent = '연결 설비: ' + (data.equipmentName || '—') + ' / 담당자: ' + managerName;

    var TYPE_LABELS = { regular: '정기 점검', abnormal: '이상 점검' };
    document.getElementById('par-inspect-type').value   = TYPE_LABELS[inspectData.type] || inspectData.type || '';
    document.getElementById('par-inspect-date').value   = inspectData.date   || '';
    document.getElementById('par-inspect-person').value = inspectData.person || '';
    document.getElementById('par-inspect-note').value   = inspectData.note   || '';

    document.getElementById('par-action-date').value   = PWR.todayStr();
    document.getElementById('par-action-person').value = '{{ request.user.name }}';
    document.getElementById('par-action-note').value   = '';
    document.getElementById('par-note-error').classList.add('hidden');

    actionModal.classList.remove('hidden');
    actionModal.classList.add('flex');
  };

  function closePwrActionRegister() {
    actionModal.classList.add('hidden');
    actionModal.classList.remove('flex');
  }

  document.getElementById('par-cancel')?.addEventListener('click', closePwrActionRegister);

  document.getElementById('pwr-action-register-form')?.addEventListener('submit', function(e) {
    e.preventDefault();
    var note = document.getElementById('par-action-note').value.trim();
    if (!note) {
      document.getElementById('par-note-error').classList.remove('hidden');
      return;
    }
    document.getElementById('par-note-error').classList.add('hidden');

    var currentInspectionId = actionModal.dataset.inspectId;
    if (!currentInspectionId) { alert('점검 정보를 찾을 수 없습니다.'); return; }

    var fd = new FormData();
    fd.append('csrfmiddlewaretoken', PWR.getCsrfToken());
    fd.append('action_date', document.getElementById('par-action-date').value.trim());
    fd.append('actor',       document.getElementById('par-action-person').value.trim());
    fd.append('action_note', note);

    fetch('/manager/power/inspect/' + currentInspectionId + '/action/', {
      method:  'POST',
      headers: { 'X-CSRFToken': PWR.getCsrfToken() },
      body:    fd,
    })
    .then(function(r) { return r.json(); })
    .then(function(resp) {
      if (!resp.ok) { alert(resp.error || '저장에 실패했습니다.'); return; }
      closePwrActionRegister();
      PWR.showSuccess('저장되었습니다.', '조치 결과가 등록되었습니다.');
      if (typeof window.loadPwrInspectionHistory === 'function') {
        window.loadPwrInspectionHistory();
      }
    })
    .catch(function() { alert('서버 오류가 발생했습니다.'); });
  });
})();
</script>
