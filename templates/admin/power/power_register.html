<!-- Register Modal -->
<div id="pwr-register-modal" class="hidden fixed inset-0 bg-slate-900/40 z-50 items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
    <div class="px-8 py-7">
      <div class="mb-6">
        <h3 class="text-xl font-bold text-slate-900 mb-1">장비 등록</h3>
        <p class="text-xs text-slate-500">현장 내 스마트 전력 시스템을 등록합니다.</p>
      </div>

      <form id="pwr-register-form" novalidate>
        <div class="space-y-4">

          <!-- 장비 유형 / 장비 코드 -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">장비 유형 <span class="text-red-500">*</span></label>
              <select id="preg-device-type" name="device_type"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-500 transition-colors">
                <option value="">장비 유형 선택</option>
                <option value="GAS">유해가스 센서</option>
                <option value="PWR">스마트 전력 시스템</option>
                <option value="LOC">위치 노드</option>
              </select>
              <p class="hidden mt-1 text-[11px] text-red-500" id="preg-type-error">장비 유형을 선택해주세요.</p>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">장비 코드 <span class="text-red-500">*</span></label>
              <input type="text" id="preg-device-code" disabled
                placeholder="장비 유형 선택 후 자동 생성"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 placeholder-slate-400 font-mono cursor-not-allowed" />
              <p class="hidden mt-1 text-[11px] text-red-500" id="preg-code-error"></p>
            </div>
          </div>

          <!-- 장비명 / 장비 ID(MAC) -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">장비명 <span class="text-red-500">*</span></label>
              <input type="text" id="preg-device-name" name="device_name"
                placeholder="장비 유형 선택 시 자동 입력"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400" />
              <p class="hidden mt-1 text-[11px] text-red-500" id="preg-name-error"></p>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">장비 ID(MAC) <span class="text-red-500">*</span></label>
              <input type="text" id="preg-device-mac" name="device_mac"
                placeholder="장비 ID(MAC) 입력"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400" />
              <p class="hidden mt-1 text-[11px] text-red-500" id="preg-mac-error"></p>
            </div>
          </div>

          <!-- 관리 부서 / 관리 담당자 -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">관리 부서 <span class="text-red-500">*</span></label>
              <select id="preg-dept" name="department"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-500">
                <option value="">부서 선택</option>
                {% for dept in departments %}
                <option value="{{ dept.id }}">{{ dept.name }}</option>
                {% empty %}
                <option value="">부서 없음</option>
                {% endfor %}
              </select>
              <p class="hidden mt-1 text-[11px] text-red-500" id="preg-dept-error">관리 부서를 선택해 주세요.</p>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">관리 담당자 <span class="text-red-500">*</span></label>
              <select id="preg-manager" name="manager"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-500">
                <option value="">담당자 선택</option>
                {% for user in managers %}
                <option value="{{ user.id }}">{{ user.name }}</option>
                {% empty %}
                <option value="">담당자 없음</option>
                {% endfor %}
              </select>
              <p class="hidden mt-1 text-[11px] text-red-500" id="preg-manager-error">관리 담당자를 선택해 주세요.</p>
            </div>
          </div>

          <!-- 연결 설비 / 사용 여부 -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">연결 설비 <span class="text-red-500">*</span></label>
              <select id="preg-equipment" name="equipment"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-500">
                <option value="">연결 설비 선택</option>
                {% for e in all_equipments %}
                <option value="{{ e.id }}">{{ e.equipment_name }}</option>
                {% empty %}
                <option value="">설비 없음</option>
                {% endfor %}
              </select>
              <p class="hidden mt-1 text-[11px] text-red-500" id="preg-equipment-error">연결 설비를 선택해 주세요.</p>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">사용 여부 <span class="text-red-500">*</span></label>
              <div class="flex items-center gap-5 pt-2">
                <label class="flex items-center gap-2 cursor-pointer text-sm text-slate-700">
                  <input type="checkbox" id="preg-status-active" checked
                    class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />사용
                </label>
                <label class="flex items-center gap-2 cursor-pointer text-sm text-slate-700">
                  <input type="checkbox" id="preg-status-inactive"
                    class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />미사용
                </label>
              </div>
              <p class="hidden mt-1 text-[11px] text-red-500" id="preg-status-error">사용 여부를 선택해 주세요.</p>
            </div>
          </div>

          <!-- 서버 주소(IP) / PORT + 연결 확인 상태 -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">서버 주소(IP) / PORT <span class="text-red-500">*</span></label>
              <input type="text" id="preg-ip" name="ip" placeholder="서버 주소 입력"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400 mb-2" />
              <input type="text" id="preg-port" name="port" placeholder="PORT 입력"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400" />
              <p class="hidden mt-1 text-[11px] text-red-500" id="preg-comm-error"></p>
              <button type="button" id="preg-conn-check"
                class="mt-2 px-4 py-2 text-xs font-medium border border-slate-200 rounded-md text-slate-700 hover:bg-slate-50 transition-colors">
                연결 확인
              </button>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">연결 확인 상태 / 마지막 확인일시</label>
              <div class="flex items-center gap-2 mt-1">
                <input type="checkbox" id="preg-conn-verified" disabled
                  class="w-4 h-4 rounded border-slate-300 flex-shrink-0" />
                <label class="text-xs text-slate-500 flex-shrink-0" id="preg-conn-label">미확인</label>
                <input type="text" id="preg-conn-date" disabled placeholder="연결 확인 후 표시"
                  class="flex-1 px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-500 placeholder-slate-400 cursor-not-allowed" />
              </div>
            </div>
          </div>

          <!-- 비고 -->
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1.5">비고</label>
            <textarea id="preg-note" name="note" rows="3" placeholder="운영 메모를 입력하세요"
              class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400 resize-none"></textarea>
          </div>
        </div>

        <div class="flex items-center justify-end gap-2 mt-6">
          <button type="button" id="pwr-register-cancel"
            class="px-5 py-2 border border-slate-200 bg-white rounded-md text-sm text-slate-700 hover:bg-slate-50 transition-colors">
            취소
          </button>
          <button type="submit"
            class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md transition-colors">
            저장
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
(function() {
  var registerModal = document.getElementById('pwr-register-modal');
  var commChecked   = false;

  var TYPE_CODES = {
    GAS: '{{ next_gas_code|default:"GAS-001" }}',
    PWR: '{{ next_pwr_code|default:"PWR-001" }}',
    LOC: '{{ next_loc_code|default:"LOC-001" }}',
  };
  var TYPE_NAMES = { GAS: '유해가스 센서', PWR: '스마트 전력 시스템', LOC: '위치 노드' };

  function closeRegisterModal() {
    registerModal.classList.add('hidden');
    registerModal.classList.remove('flex');
    resetForm();
  }
  function resetForm() {
    document.getElementById('pwr-register-form').reset();
    document.getElementById('preg-device-code').value = '';
    document.getElementById('preg-conn-verified').checked = false;
    document.getElementById('preg-conn-date').value = '';
    document.getElementById('preg-conn-label').textContent = '미확인';
    document.getElementById('preg-status-active').checked = true;
    document.getElementById('preg-status-inactive').checked = false;
    commChecked = false;
    clearAllErrors();
  }
  function clearAllErrors() {
    ['preg-type-error','preg-name-error','preg-mac-error','preg-dept-error','preg-manager-error','preg-equipment-error','preg-comm-error','preg-status-error'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    });
    ['preg-device-type','preg-ip','preg-port','preg-device-name','preg-device-mac'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) { el.classList.remove('border-red-400'); el.classList.add('border-slate-200'); }
    });
  }
  function showError(errId, msg, fieldId) {
    var e = document.getElementById(errId);
    if (e) { e.textContent = msg; e.classList.remove('hidden'); }
    if (fieldId) { var f = document.getElementById(fieldId); if (f) { f.classList.add('border-red-400'); f.classList.remove('border-slate-200'); } }
  }
  function hideError(errId, fieldId) {
    var e = document.getElementById(errId);
    if (e) e.classList.add('hidden');
    if (fieldId) { var f = document.getElementById(fieldId); if (f) { f.classList.remove('border-red-400'); f.classList.add('border-slate-200'); } }
  }

  // 장비 유형 → 코드 자동 생성
  document.getElementById('preg-device-type')?.addEventListener('change', function() {
    var val    = this.value;
    var codeEl = document.getElementById('preg-device-code');
    var nameEl = document.getElementById('preg-device-name');
    if (val && TYPE_CODES[val]) {
      codeEl.value = TYPE_CODES[val];
      nameEl.placeholder = TYPE_NAMES[val];
      hideError('preg-type-error', 'preg-device-type');
    } else {
      codeEl.value = '';
      nameEl.placeholder = '장비 유형 선택 시 자동 입력';
    }
    commChecked = false;
  });

  // 연결 확인 버튼
  document.getElementById('preg-conn-check')?.addEventListener('click', function() {
    var btn  = this;
    var ip   = document.getElementById('preg-ip').value.trim();
    var port = document.getElementById('preg-port').value.trim();
    var mac  = document.getElementById('preg-device-mac').value.trim();

    if (!ip) { showError('preg-comm-error', 'IP 주소를 입력해 주세요.', 'preg-ip'); return; }
    var ipRegex = /^(\d{1,3}\.){3}\d{1,3}$/;
    if (!ipRegex.test(ip) || ip.split('.').some(function(n) { return parseInt(n) > 255; })) {
      showError('preg-comm-error', 'IP 주소 형식이 올바르지 않습니다.', 'preg-ip'); return;
    }
    if (!port) { showError('preg-comm-error', '포트 번호를 입력해 주세요.', 'preg-port'); return; }
    if (!/^\d+$/.test(port)) { showError('preg-comm-error', '포트 번호 형식이 올바르지 않습니다.', 'preg-port'); return; }
    var portNum = parseInt(port);
    if (portNum < 1 || portNum > 65535) { showError('preg-comm-error', '포트 번호는 1~65535 범위로 입력해 주세요.', 'preg-port'); return; }
    hideError('preg-comm-error', 'preg-ip');

    btn.disabled = true;
    btn.textContent = '확인 중...';

    var fd = new FormData();
    fd.append('ip', ip);
    fd.append('port', port);
    fd.append('mac', mac);

    fetch('{% url "power_comm_check" %}', {
      method: 'POST',
      headers: { 'X-CSRFToken': PWR.getCsrfToken ? PWR.getCsrfToken() : document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '' },
      body: fd,
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      btn.disabled = false;
      btn.textContent = '연결 확인';
      if (data.ok) {
        commChecked = true;
        document.getElementById('preg-conn-verified').checked = true;
        document.getElementById('preg-conn-label').textContent = '확인';
        document.getElementById('preg-conn-date').value = data.checked_at || '';
        hideError('preg-comm-error');
      } else if (data.mac_mismatch) {
        commChecked = false;
        showError('preg-comm-error', '입력한 장비 ID와 실제 응답 장비 정보가 일치하지 않습니다.');
      } else if (data.conn_fail) {
        commChecked = false;
        showError('preg-comm-error', data.error || '장비와 연결할 수 없습니다. 통신 정보를 확인해 주세요.');
      } else {
        commChecked = false;
        showError('preg-comm-error', data.error || '장비와 연결할 수 없습니다. 통신 정보를 확인해 주세요.');
      }
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = '연결 확인';
      commChecked = false;
      showError('preg-comm-error', '장비 응답이 없습니다. 전원 및 상태를 확인해 주세요.');
    });
  });

  // IP/PORT 변경 시 연결 확인 리셋
  ['preg-ip','preg-port'].forEach(function(id) {
    document.getElementById(id)?.addEventListener('input', function() {
      commChecked = false;
      document.getElementById('preg-conn-verified').checked = false;
      document.getElementById('preg-conn-label').textContent = '미확인';
      document.getElementById('preg-conn-date').value = '';
    });
  });

  // 사용/미사용 단일 선택
  var cbActive   = document.getElementById('preg-status-active');
  var cbInactive = document.getElementById('preg-status-inactive');
  cbActive?.addEventListener('change',   function() { if (cbActive.checked)   cbInactive.checked = false; });
  cbInactive?.addEventListener('change', function() { if (cbInactive.checked) cbActive.checked   = false; });

  // 폼 제출
  document.getElementById('pwr-register-form')?.addEventListener('submit', function(e) {
    e.preventDefault();
    clearAllErrors();
    var valid = true;

    var typeVal = document.getElementById('preg-device-type').value;
    if (!typeVal) {
      showError('preg-type-error', '장비 유형을 선택해주세요.', 'preg-device-type'); valid = false;
    }

    if (!document.getElementById('preg-device-code').value.trim()) {
      showError('preg-code-error', typeVal ? '장비코드를 생성할 수 없습니다.' : '장비 유형 선택 후 장비코드가 자동 생성됩니다.'); valid = false;
    }

    var nameVal = document.getElementById('preg-device-name').value.trim();
    if (!nameVal) {
      showError('preg-name-error', '장비명을 입력해 주세요.', 'preg-device-name'); valid = false;
    } else if (nameVal.length > 50) {
      showError('preg-name-error', '장비명은 50자 이내로 입력해 주세요.', 'preg-device-name'); valid = false;
    }

    var macVal = document.getElementById('preg-device-mac').value.trim();
    if (!macVal) {
      showError('preg-mac-error', '장비 ID를 입력해 주세요.', 'preg-device-mac'); valid = false;
    } else if (!/^([0-9A-Fa-f]{2}[:\-]){5}[0-9A-Fa-f]{2}$/.test(macVal)) {
      showError('preg-mac-error', '장비 ID 형식이 올바르지 않습니다.', 'preg-device-mac'); valid = false;
    }

    if (!document.getElementById('preg-dept').value) {
      showError('preg-dept-error', '관리 부서를 선택해 주세요.'); valid = false;
    }
    if (!document.getElementById('preg-manager').value) {
      showError('preg-manager-error', '관리 담당자를 선택해 주세요.'); valid = false;
    }
    if (!document.getElementById('preg-equipment').value) {
      showError('preg-equipment-error', '연결 설비를 선택해 주세요.'); valid = false;
    }
    if (!document.getElementById('preg-ip').value.trim()) {
      showError('preg-comm-error', 'IP 주소를 입력해 주세요.', 'preg-ip'); valid = false;
    }
    if (!document.getElementById('preg-port').value.trim()) {
      showError('preg-comm-error', '포트 번호를 입력해 주세요.', 'preg-port'); valid = false;
    }
    if (!commChecked) {
      showError('preg-comm-error', '저장 전에 연결 확인이 필요합니다.'); valid = false;
    }
    if (!cbActive.checked && !cbInactive.checked) {
      showError('preg-status-error', '사용 여부를 선택해 주세요.'); valid = false;
    }

    if (!valid) return;

    var fd = new FormData();
    fd.append('device_type', document.getElementById('preg-device-type').value);
    fd.append('device_name', nameVal);
    fd.append('device_mac',  macVal);
    fd.append('department',  document.getElementById('preg-dept').value);
    fd.append('manager',     document.getElementById('preg-manager').value);
    fd.append('equipment',   document.getElementById('preg-equipment').value);
    fd.append('ip',          document.getElementById('preg-ip').value.trim());
    fd.append('port',        document.getElementById('preg-port').value.trim());
    fd.append('is_active',   cbActive.checked ? 'true' : 'false');
    fd.append('note',        document.getElementById('preg-note').value.trim());

    fetch('{% url "power_create" %}', {
      method: 'POST',
      headers: { 'X-CSRFToken': PWR.getCsrfToken ? PWR.getCsrfToken() : document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '' },
      body: fd,
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        closeRegisterModal();
        PWR.showSuccess('등록되었습니다.', '장비가 목록에 추가되었습니다.');
        document.getElementById('pwr-success-confirm')?.addEventListener('click', function() {
          location.reload();
        }, { once: true });
      } else {
        if (data.error && data.error.includes('이미 등록된')) {
          showError('preg-mac-error', '이미 등록된 장비 ID입니다.', 'preg-device-mac');
        } else {
          showError('preg-mac-error', data.error || '등록에 실패했습니다.');
        }
      }
    })
    .catch(function() { showError('preg-mac-error', '서버 오류가 발생했습니다.'); });
  });

  document.getElementById('pwr-register-cancel')?.addEventListener('click', closeRegisterModal);
})();
</script>
