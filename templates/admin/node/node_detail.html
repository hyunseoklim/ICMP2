      var actionHtml;
      if (!row.action) {
        actionHtml = '<span class="text-slate-400">-</span>';
      } else if (row.action === '조치 필요') {
        actionHtml = '<span class="font-medium text-red-600">조치 필요</span>';
      } else {
        actionHtml = '<span class="text-slate-600">조치 완료</span>';
      }
      var mgrHtml;
      if (row.actionMgr) {
        mgrHtml = '<span class="text-slate-600">' + row.actionMgr + '</span>';
      } else if (row.action === '조치 필요') {
        var safeNote = (row.note || '').replace(/"/g, '&quot;');
        mgrHtml = '<button type="button" class="text-blue-600 hover:underline"' +
          ' data-type="' + row.type + '"' +
          ' data-date="' + row.date + '"' +
          ' data-inspector="' + row.inspector + '"' +
          ' data-note="' + safeNote + '"' +
          ' onclick="if(typeof window.openNodeActionRegModal===\'function\')' +
          'window.openNodeActionRegModal(window._ndtlNodeId,this.dataset.type,this.dataset.date,this.dataset.inspector,this.dataset.note)">' +
          '조치 등록</button>';
      } else {
        mgrHtml = '<span class="text-slate-400">-</span>';
      }
      var tr = document.createElement('tr');
      tr.className = 'border-t border-slate-100';
      tr.innerHTML =
        '<td class="px-3 py-2.5">' + typeHtml + '</td>' +
        '<td class="px-3 py-2.5">' + actionHtml + '</td>' +
        '<td class="px-3 py-2.5 text-slate-600 whitespace-nowrap">' + row.date + '</td>' +
        '<td class="px-3 py-2.5 text-slate-600 whitespace-nowrap">' + row.inspector + '</td>' +
        '<td class="px-3 py-2.5 whitespace-nowrap">' + mgrHtml + '</td>' +
        '<td class="px-3 py-2.5 text-slate-600">' + row.note + '</td>';
      tbody.appendChild(tr);
    });
  }

  // ── 점검 상태 색상 ──
  function flagClass(v) {
    if (v === '점검 필요') return 'text-red-600';
    if (v === '점검 완료') return 'text-emerald-600';
    if (v === '점검 예정') return 'text-amber-600';
    return 'text-slate-400';
  }
  function stateClass(v) {
    if (v === '조치 필요') return 'text-red-600';
    if (v === '정상')      return 'text-emerald-600';
    return 'text-slate-400';
  }

  // ── 탭 공통 클래스 ──
  var TAB_ACTIVE   = 'px-4 py-2.5 text-sm font-medium border-b-2 border-blue-600 text-blue-600 -mb-px transition-colors';
  var TAB_INACTIVE = 'px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 -mb-px transition-colors';

  function activateTab(tab) {
    var isBasic = (tab === 'basic');
    document.getElementById('ndtl-tab-basic').className    = isBasic ? TAB_ACTIVE : TAB_INACTIVE;
    document.getElementById('ndtl-tab-inspect').className  = isBasic ? TAB_INACTIVE : TAB_ACTIVE;
    document.getElementById('ndtl-panel-basic').classList.toggle('hidden', !isBasic);
    document.getElementById('ndtl-panel-inspect').classList.toggle('hidden', isBasic);
    document.getElementById('ndtl-footer-basic').classList.toggle('hidden', !isBasic);
    document.getElementById('ndtl-footer-inspect').classList.toggle('hidden', isBasic);
    if (isBasic) {
      document.getElementById('ndtl-title').textContent    = window._ndtlNodeId ? '위치 노드 ' + window._ndtlNodeId : '위치 노드 상세';
      document.getElementById('ndtl-subtitle').textContent = '위치 노드의 기본 정보를 확인하고 수정합니다.';
    } else {
      document.getElementById('ndtl-title').textContent    = '위치 노드 상세';
      document.getElementById('ndtl-subtitle').textContent = '위치 노드의 점검 실행 이력과 최근 상태를 확인합니다.';
    }
  }

  document.getElementById('ndtl-tab-basic')?.addEventListener('click',   function() { activateTab('basic'); });
  document.getElementById('ndtl-tab-inspect')?.addEventListener('click', function() { activateTab('inspect'); });

  // ── 변경 감지 ──
  function getFormState() {
    return {
      type:           document.getElementById('ndtl-equip-type').value,
      code:           document.getElementById('ndtl-equip-code').value.trim(),
      lastRecv:       document.getElementById('ndtl-last-recv').value,
      manager:        document.getElementById('ndtl-manager').value,
      statusActive:   document.getElementById('ndtl-status-active').checked,
      statusInactive: document.getElementById('ndtl-status-inactive').checked,
      note:           document.getElementById('ndtl-note').value.trim()
    };
  }

  function checkChanges() {
    var changed = Object.keys(getFormState()).some(function(k) { return getFormState()[k] !== snapshot[k]; });
    submitBtn.disabled = !changed;
    submitBtn.className = changed
      ? 'px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md transition-colors'
      : 'px-5 py-2 bg-slate-300 text-slate-500 text-sm font-medium rounded-md cursor-not-allowed transition-colors';
  }

  ['ndtl-equip-type','ndtl-equip-code','ndtl-last-recv','ndtl-manager','ndtl-note'].forEach(function(id) {
    document.getElementById(id)?.addEventListener('input',  checkChanges);
    document.getElementById(id)?.addEventListener('change', checkChanges);
  });

  document.getElementById('ndtl-status-active')?.addEventListener('change', function() {
    if (this.checked) document.getElementById('ndtl-status-inactive').checked = false;
    checkChanges();
  });
  document.getElementById('ndtl-status-inactive')?.addEventListener('change', function() {
    if (this.checked) document.getElementById('ndtl-status-active').checked = false;
    checkChanges();
  });

  // ── 에러 처리 ──
  function clearErrors() {
    ['ndtl-equip-type-error','ndtl-manager-error'].forEach(function(id) {
      var el = document.getElementById(id); if (el) el.classList.add('hidden');
    });
    ['ndtl-equip-type','ndtl-manager'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) { el.classList.remove('border-red-400'); el.classList.add('border-slate-200'); }
    });
  }

  function validate() {
    clearErrors();
    var valid = true;
    if (!document.getElementById('ndtl-equip-type').value) {
      document.getElementById('ndtl-equip-type-error').classList.remove('hidden');
      var f = document.getElementById('ndtl-equip-type');
      f.classList.add('border-red-400'); f.classList.remove('border-slate-200');
      valid = false;
    }
    if (!document.getElementById('ndtl-manager').value) {
      document.getElementById('ndtl-manager-error').classList.remove('hidden');
      var f2 = document.getElementById('ndtl-manager');
      f2.classList.add('border-red-400'); f2.classList.remove('border-slate-200');
      valid = false;
    }
    return valid;
  }

  // ── 연결 확인 ──
  document.getElementById('ndtl-conn-check')?.addEventListener('click', function() {
    document.getElementById('ndtl-conn-result').value = '최근 확인 결과: 연결 정상';
    document.getElementById('ndtl-conn-msg').classList.remove('hidden');
    document.getElementById('ndtl-conn-state').value = '정상';
  });

  // ── 모달 열기 ──
  window.openNodeDetailModal = function(nodeId) {
    window._ndtlNodeId = nodeId;
    var data = NODE_DATA[nodeId] || {};
    var managerName = MANAGERS[data.manager] || '—';

    // 기본 정보 채우기
    document.getElementById('ndtl-equip-type').value        = data.type    || '';
    document.getElementById('ndtl-equip-code').value        = data.code    || '';
    document.getElementById('ndtl-node-id').value           = nodeId       || '';
    document.getElementById('ndtl-comm-type').value         = data.commType || '';
    document.getElementById('ndtl-manager').value           = data.manager || '';
    document.getElementById('ndtl-status-active').checked   = !!data.statusActive;
    document.getElementById('ndtl-status-inactive').checked = !data.statusActive;
    document.getElementById('ndtl-conn-state').value        = data.connState || '';
    document.getElementById('ndtl-note').value              = data.note    || '';
    document.getElementById('ndtl-conn-result').value       = '';
    document.getElementById('ndtl-conn-msg').classList.add('hidden');

    // 마지막 데이터 수신 옵션
    var sel = document.getElementById('ndtl-last-recv');
    sel.innerHTML = '';
    if (data.lastRecv) {
      [data.lastRecv, '2026-04-11 09:30:14', '2026-04-10 16:45:02'].forEach(function(v) {
        var opt = document.createElement('option');
        opt.value = v; opt.textContent = v;
        sel.appendChild(opt);
      });
    }

    // 점검 이력 채우기
    document.getElementById('ndtl-insp-summary').textContent = nodeId + ' · 위치 노드 · ' + (data.deviceId || '—');
    document.getElementById('ndtl-insp-manager-name').textContent = managerName;

    var flagEl   = document.getElementById('ndtl-insp-flag');
    var stateEl  = document.getElementById('ndtl-insp-state');
    flagEl.textContent   = data.inspectFlag   || '—';
    flagEl.className     = 'text-sm font-semibold ' + flagClass(data.inspectFlag);
    stateEl.textContent  = data.currentState  || '—';
    stateEl.className    = 'text-sm font-semibold ' + stateClass(data.currentState);
    document.getElementById('ndtl-insp-last').textContent  = data.lastInspect  || '—';
    document.getElementById('ndtl-insp-next').textContent  = data.nextInspect  || '—';
    renderHistory(data.history);

    clearErrors();
    activateTab('basic');

    snapshot = getFormState();
    submitBtn.disabled = true;
    submitBtn.className = 'px-5 py-2 bg-slate-300 text-slate-500 text-sm font-medium rounded-md cursor-not-allowed transition-colors';

    modal.classList.remove('hidden');
    modal.classList.add('flex');
    lucide.createIcons();
  };

  function closeModal() {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  document.getElementById('ndtl-close')?.addEventListener('click', closeModal);
  document.getElementById('ndtl-cancel')?.addEventListener('click', closeModal);
  document.getElementById('ndtl-inspect-close')?.addEventListener('click', closeModal);

  document.getElementById('ndtl-submit')?.addEventListener('click', function() {
    if (this.disabled) return;
    if (!validate()) return;
    confirmModal.classList.remove('hidden');
    confirmModal.classList.add('flex');
  });

  document.getElementById('ndtl-confirm-cancel')?.addEventListener('click', function() {
    confirmModal.classList.add('hidden');
    confirmModal.classList.remove('flex');
  });

  document.getElementById('ndtl-confirm-ok')?.addEventListener('click', function() {
    confirmModal.classList.add('hidden');
    confirmModal.classList.remove('flex');
    closeModal();
    successModal.classList.remove('hidden');
    successModal.classList.add('flex');
    lucide.createIcons();
  });

  document.getElementById('ndtl-success-confirm')?.addEventListener('click', function() {
    successModal.classList.add('hidden');
    successModal.classList.remove('flex');
  });
})();
</script>
