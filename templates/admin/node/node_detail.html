<!-- Node Detail Success Modal -->
<div id="ndtl-success-modal" class="hidden fixed inset-0 bg-slate-900/40 z-[70] items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-sm px-8 py-8 text-center">
    <div class="w-12 h-12 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-4">
      <i data-lucide="check" class="w-6 h-6 text-emerald-600"></i>
    </div>
    <p class="text-base font-semibold text-slate-900 mb-1">수정되었습니다.</p>
    <p class="text-xs text-slate-500 mb-6">노드 정보가 업데이트되었습니다.</p>
    <button type="button" id="ndtl-success-confirm"
      class="w-full px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md transition-colors">확인</button>
  </div>
</div>

<!-- Node Detail Modal -->
<div id="node-detail-modal" class="hidden fixed inset-0 bg-slate-900/40 z-50 items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">

    <!-- Header -->
    <div class="flex items-start justify-between px-8 pt-7 pb-4">
      <div>
        <h3 class="text-xl font-bold text-slate-900 mb-1" id="ndtl-title">위치 노드 상세</h3>
        <p class="text-xs text-slate-500" id="ndtl-subtitle">해당 장비의 기본 정보를 확인하고 수정할 수 있습니다.</p>
      </div>
      <button type="button" id="ndtl-close"
        class="p-1.5 rounded-md text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors flex-shrink-0">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-slate-200 px-8">
      <button type="button" id="ndtl-tab-basic"
        class="px-4 py-2.5 text-sm font-medium border-b-2 border-blue-600 text-blue-600 -mb-px transition-colors">기본 정보</button>
      <button type="button" id="ndtl-tab-inspect"
        class="px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 -mb-px transition-colors">점검 실행 및 이력</button>
    </div>

    <!-- ───────── Panel: 기본 정보 ───────── -->
    <div id="ndtl-panel-basic">
      <form id="node-detail-form" novalidate class="px-8 pt-5 pb-2">
        <div class="space-y-4">

          <!-- Row 1: 장비 유형 | 장비 코드 -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">장비 유형 <span class="text-red-500">*</span></label>
              <select id="ndtl-device-type" disabled
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed">
                <option value="GAS">유해가스 센서</option>
                <option value="PWR">스마트 전력 시스템</option>
                <option value="LOC">위치 노드</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">장비 코드 <span class="text-red-500">*</span></label>
              <input type="text" id="ndtl-device-code" placeholder="장비 코드"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400" />
              <p class="hidden mt-1 text-[11px] text-red-500" id="ndtl-code-error"></p>
            </div>
          </div>

          <!-- Row 2: 장비명 | 장비 ID(MAC) -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">장비명 <span class="text-red-500">*</span></label>
              <input type="text" id="ndtl-device-name" placeholder="장비명 입력"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400" />
              <p class="hidden mt-1 text-[11px] text-red-500" id="ndtl-name-error"></p>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">장비 ID(MAC) <span class="text-red-500">*</span></label>
              <input type="text" id="ndtl-device-mac" placeholder="AA:BB:CC:DD:EE:FF"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400" />
              <p class="hidden mt-1 text-[11px] text-red-500" id="ndtl-mac-error"></p>
            </div>
          </div>

          <!-- Row 3: 관리 부서 | 관리 담당자 -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">관리 부서 <span class="text-red-500">*</span></label>
              <select id="ndtl-dept"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-700">
                <option value="">부서 선택</option>
                {% for dept in departments %}
                <option value="{{ dept.id }}">{{ dept.name }}</option>
                {% endfor %}
              </select>
              <p class="hidden mt-1 text-[11px] text-red-500" id="ndtl-dept-error">관리 부서를 선택해 주세요.</p>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">관리 담당자 <span class="text-red-500">*</span></label>
              <select id="ndtl-manager"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-700">
                <option value="">담당자 선택</option>
                {% for mgr in managers %}
                <option value="{{ mgr.id }}">{{ mgr.name }}</option>
                {% endfor %}
              </select>
              <p class="hidden mt-1 text-[11px] text-red-500" id="ndtl-manager-error">관리 담당자를 선택해 주세요.</p>
            </div>
          </div>

          <!-- Row 4: IP/PORT + 연결 확인 | 사용 여부 + 연결 상태 -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">장비 통신 IP / PORT <span class="text-red-500">*</span></label>
              <input type="text" id="ndtl-ip" placeholder="IP 입력"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400 mb-2" />
              <input type="text" id="ndtl-port" placeholder="PORT 입력"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400" />
              <p class="hidden mt-1 text-[11px] text-red-500" id="ndtl-comm-error"></p>
              <button type="button" id="ndtl-comm-check"
                class="mt-2 px-4 py-2 text-xs font-medium border border-slate-200 rounded-md text-slate-700 hover:bg-slate-50 transition-colors">
                통신 확인
              </button>
            </div>
            <div class="flex flex-col gap-4">
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1.5">사용 여부 <span class="text-red-500">*</span></label>
                <div class="flex items-center gap-5 pt-1">
                  <label class="flex items-center gap-2 cursor-pointer text-sm text-slate-700">
                    <input type="checkbox" id="ndtl-status-active"
                      class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />사용
                  </label>
                  <label class="flex items-center gap-2 cursor-pointer text-sm text-slate-700">
                    <input type="checkbox" id="ndtl-status-inactive"
                      class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />미사용
                  </label>
                </div>
                <p class="hidden mt-1 text-[11px] text-red-500" id="ndtl-status-error">사용 여부를 선택해 주세요.</p>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1.5">연결 확인 상태 / 마지막 연결일시</label>
                <div class="flex items-center gap-2">
                  <input type="checkbox" id="ndtl-conn-verified" disabled
                    class="w-4 h-4 rounded border-slate-300 flex-shrink-0" />
                  <input type="text" id="ndtl-conn-date" disabled
                    placeholder="통신 확인 후 표시"
                    class="flex-1 px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-500 placeholder-slate-400 cursor-not-allowed" />
                </div>
              </div>
            </div>
          </div>

          <!-- Row 5: 비고 -->
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1.5">비고</label>
            <textarea id="ndtl-note" rows="3" placeholder="운영 메모를 입력하세요"
              class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400 resize-none"></textarea>
          </div>

        </div>
      </form>
    </div>

    <!-- ───────── Panel: 점검 실행 및 이력 ───────── -->
    <div id="ndtl-panel-inspect" class="hidden">

      <!-- 노드 요약 -->
      <div class="px-8 pt-5 pb-4 border-b border-slate-100 flex items-start justify-between gap-4">
        <div>
          <p class="text-base font-bold text-slate-900" id="ndtl-insp-node-code">—</p>
          <p class="text-xs text-slate-600 mt-0.5" id="ndtl-insp-device-info">위치 노드 · —</p>
          <p class="text-xs text-slate-500 mt-1">담당자 : <span id="ndtl-insp-manager-name">—</span></p>
        </div>
        <button type="button" id="ndtl-inspect-register-btn"
          class="flex-shrink-0 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium rounded-md transition-colors">
          점검 등록
        </button>
      </div>

      <!-- 최근 점검 상태 -->
      <div class="px-8 py-4">
        <p class="text-xs font-semibold text-slate-700 mb-3">최근 점검 상태</p>
        <div class="grid grid-cols-4 gap-3">
          <div class="bg-slate-50 rounded-lg p-3 text-center">
            <p class="text-[11px] text-slate-500 mb-1.5">점검 여부</p>
            <p class="text-sm font-semibold" id="ndtl-insp-flag">—</p>
          </div>
          <div class="bg-slate-50 rounded-lg p-3 text-center">
            <p class="text-[11px] text-slate-500 mb-1.5">최근 점검일</p>
            <p class="text-sm font-semibold text-slate-800" id="ndtl-insp-last">—</p>
          </div>
          <div class="bg-slate-50 rounded-lg p-3 text-center">
            <p class="text-[11px] text-slate-500 mb-1.5">다음 점검 예정일</p>
            <p class="text-sm font-semibold text-slate-800" id="ndtl-insp-next">—</p>
          </div>
          <div class="bg-slate-50 rounded-lg p-3 text-center">
            <p class="text-[11px] text-slate-500 mb-1.5">현재 상태</p>
            <p class="text-sm font-semibold" id="ndtl-insp-state">—</p>
          </div>
        </div>
      </div>

      <!-- 점검 이력 -->
      <div class="px-8 pb-6">
        <p class="text-xs font-semibold text-slate-700 mb-3">점검 이력</p>
        <div class="border border-slate-200 rounded-lg overflow-hidden">
          <div class="overflow-y-auto" style="max-height:190px;">
            <table class="w-full text-xs">
              <thead class="sticky top-0 bg-slate-50 border-b border-slate-200">
                <tr>
                  <th class="px-3 py-2.5 text-left font-medium text-slate-500 whitespace-nowrap">점검 구분</th>
                  <th class="px-3 py-2.5 text-left font-medium text-slate-500 whitespace-nowrap">조치 여부</th>
                  <th class="px-3 py-2.5 text-left font-medium text-slate-500 whitespace-nowrap">점검일</th>
                  <th class="px-3 py-2.5 text-left font-medium text-slate-500 whitespace-nowrap">점검자</th>
                  <th class="px-3 py-2.5 text-left font-medium text-slate-500 whitespace-nowrap">조치 담당자</th>
                  <th class="px-3 py-2.5 text-left font-medium text-slate-500">점검/조치 내용</th>
                </tr>
              </thead>
              <tbody id="ndtl-history-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>

    <!-- Footer: 기본 정보 -->
    <div id="ndtl-footer-basic" class="border-t border-slate-100">
      <div class="flex items-center justify-end gap-2 px-8 py-5">
        <button type="button" id="ndtl-cancel"
          class="px-5 py-2 border border-slate-200 bg-white rounded-md text-sm text-slate-700 hover:bg-slate-50 transition-colors">
          취소
        </button>
        <button type="button" id="ndtl-submit" disabled
          class="px-5 py-2 bg-slate-300 text-slate-500 text-sm font-medium rounded-md cursor-not-allowed transition-colors">
          저장
        </button>
      </div>
    </div>

    <!-- Footer: 점검 실행 및 이력 -->
    <div id="ndtl-footer-inspect" class="hidden border-t border-slate-100">
      <div class="flex items-center justify-end px-8 py-5">
        <button type="button" id="ndtl-inspect-close"
          class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md transition-colors">
          확인
        </button>
      </div>
    </div>

  </div>
</div>

<script>
(function() {
  var modal        = document.getElementById('node-detail-modal');
  var successModal = document.getElementById('ndtl-success-modal');
  var submitBtn    = document.getElementById('ndtl-submit');

  var _currentPk   = null;
  var _currentData = null;
  var snapshot     = {};
  var commChecked  = false;
  var origIp       = '';
  var origPort     = '';

  function getCsrf() {
    var m = document.cookie.match(/csrftoken=([^;]+)/);
    return m ? m[1] : '';
  }

  // ── 에러 헬퍼 ──
  function clearAllErrors() {
    ['ndtl-code-error','ndtl-name-error','ndtl-mac-error','ndtl-dept-error','ndtl-manager-error','ndtl-comm-error','ndtl-status-error'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    });
    ['ndtl-device-code','ndtl-device-name','ndtl-device-mac','ndtl-dept','ndtl-manager','ndtl-ip','ndtl-port'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) { el.classList.remove('border-red-400'); el.classList.add('border-slate-200'); }
    });
  }

  function showError(errId, msg, fieldId) {
    var errEl = document.getElementById(errId);
    if (errEl) { errEl.textContent = msg; errEl.classList.remove('hidden'); }
    if (fieldId) {
      var fEl = document.getElementById(fieldId);
      if (fEl) { fEl.classList.add('border-red-400'); fEl.classList.remove('border-slate-200'); }
    }
  }

  // ── 변경 감지 → 저장 버튼 활성화 ──
  function getFormState() {
    return {
      code:     document.getElementById('ndtl-device-code').value.trim(),
      name:     document.getElementById('ndtl-device-name').value.trim(),
      mac:      document.getElementById('ndtl-device-mac').value.trim(),
      dept:     document.getElementById('ndtl-dept').value,
      manager:  document.getElementById('ndtl-manager').value,
      ip:       document.getElementById('ndtl-ip').value.trim(),
      port:     document.getElementById('ndtl-port').value.trim(),
      active:   document.getElementById('ndtl-status-active').checked,
      inactive: document.getElementById('ndtl-status-inactive').checked,
      note:     document.getElementById('ndtl-note').value.trim(),
    };
  }

  function checkChanges() {
    var cur     = getFormState();
    var changed = Object.keys(cur).some(function(k) { return String(cur[k]) !== String(snapshot[k]); });
    submitBtn.disabled = !changed;
    submitBtn.className = changed
      ? 'px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md transition-colors'
      : 'px-5 py-2 bg-slate-300 text-slate-500 text-sm font-medium rounded-md cursor-not-allowed transition-colors';
  }

  var watchIds = ['ndtl-device-code','ndtl-device-name','ndtl-device-mac','ndtl-dept','ndtl-manager','ndtl-ip','ndtl-port','ndtl-note'];
  watchIds.forEach(function(id) {
    document.getElementById(id)?.addEventListener('input',  checkChanges);
    document.getElementById(id)?.addEventListener('change', checkChanges);
  });
  document.getElementById('ndtl-status-active')?.addEventListener('change', function() {
    if (this.checked) document.getElementById('ndtl-status-inactive').checked = false;
    checkChanges();
  });
  document.getElementById('ndtl-status-inactive')?.addEventListener('change', function() {
    if (this.checked) document.getElementById('ndtl-status-active').checked = false;
    checkChanges();
  });

  // IP/PORT 변경 시 통신 확인 초기화
  ['ndtl-ip','ndtl-port'].forEach(function(id) {
    document.getElementById(id)?.addEventListener('input', function() {
      var ip   = document.getElementById('ndtl-ip').value.trim();
      var port = document.getElementById('ndtl-port').value.trim();
      if (ip !== origIp || port !== origPort) {
        commChecked = false;
        document.getElementById('ndtl-conn-verified').checked = false;
        document.getElementById('ndtl-conn-date').value = '';
      }
    });
  });

  // 통신 확인 버튼
  document.getElementById('ndtl-comm-check')?.addEventListener('click', function() {
    var ip   = document.getElementById('ndtl-ip').value.trim();
    var port = document.getElementById('ndtl-port').value.trim();

    if (!ip) { showError('ndtl-comm-error', 'IP 주소를 입력해 주세요.', 'ndtl-ip'); return; }
    var ipRegex = /^(\d{1,3}\.){3}\d{1,3}$/;
    if (!ipRegex.test(ip) || ip.split('.').some(function(n) { return parseInt(n) > 255; })) {
      showError('ndtl-comm-error', 'IP 주소 형식이 올바르지 않습니다.', 'ndtl-ip'); return;
    }
    if (!port) { showError('ndtl-comm-error', '포트 번호를 입력해 주세요.', 'ndtl-port'); return; }
    if (!/^\d+$/.test(port)) { showError('ndtl-comm-error', '포트 번호 형식이 올바르지 않습니다.', 'ndtl-port'); return; }
    var portNum = parseInt(port);
    if (portNum < 1 || portNum > 65535) { showError('ndtl-comm-error', '포트 번호는 1~65535 범위로 입력해 주세요.', 'ndtl-port'); return; }

    var errEl = document.getElementById('ndtl-comm-error');
    if (errEl) errEl.classList.add('hidden');
    ['ndtl-ip','ndtl-port'].forEach(function(fid) {
      var f = document.getElementById(fid);
      if (f) { f.classList.remove('border-red-400'); f.classList.add('border-slate-200'); }
    });

    commChecked = true;
    origIp   = ip;
    origPort = port;
    document.getElementById('ndtl-conn-verified').checked = true;
    var now = new Date();
    var pad = function(n) { return String(n).padStart(2, '0'); };
    document.getElementById('ndtl-conn-date').value =
      now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) + ' ' +
      pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  });

  // ── 유효성 검사 ──
  function validate() {
    clearAllErrors();
    var valid = true;

    var codeVal = document.getElementById('ndtl-device-code').value.trim();
    if (!codeVal) {
      showError('ndtl-code-error', '장비 코드를 입력해 주세요.', 'ndtl-device-code'); valid = false;
    }

    var nameVal = document.getElementById('ndtl-device-name').value.trim();
    if (!nameVal) {
      showError('ndtl-name-error', '장비명을 입력해 주세요.', 'ndtl-device-name'); valid = false;
    } else if (nameVal.length > 50) {
      showError('ndtl-name-error', '장비명은 50자 이내로 입력해 주세요.', 'ndtl-device-name'); valid = false;
    }

    var macVal = document.getElementById('ndtl-device-mac').value.trim();
    if (!macVal) {
      showError('ndtl-mac-error', '장비 ID를 입력해 주세요.', 'ndtl-device-mac'); valid = false;
    } else if (!/^([0-9A-Fa-f]{2}[:\-]){5}[0-9A-Fa-f]{2}$/.test(macVal)) {
      showError('ndtl-mac-error', '장비 ID 형식이 올바르지 않습니다.', 'ndtl-device-mac'); valid = false;
    }

    if (!document.getElementById('ndtl-dept').value) {
      showError('ndtl-dept-error', '관리 부서를 선택해 주세요.', 'ndtl-dept'); valid = false;
    }
    if (!document.getElementById('ndtl-manager').value) {
      showError('ndtl-manager-error', '관리 담당자를 선택해 주세요.', 'ndtl-manager'); valid = false;
    }

    var ipVal   = document.getElementById('ndtl-ip').value.trim();
    var portVal = document.getElementById('ndtl-port').value.trim();
    if (!ipVal) {
      showError('ndtl-comm-error', 'IP 주소를 입력해 주세요.', 'ndtl-ip'); valid = false;
    } else if (!portVal) {
      showError('ndtl-comm-error', '포트 번호를 입력해 주세요.', 'ndtl-port'); valid = false;
    }

    // IP/PORT가 변경됐는데 통신 확인 안 했으면 경고
    if (valid && (ipVal !== origIp || portVal !== origPort) && !commChecked) {
      showError('ndtl-comm-error', '변경된 통신 정보의 연결 확인이 필요합니다.'); valid = false;
    }

    var cbActive   = document.getElementById('ndtl-status-active');
    var cbInactive = document.getElementById('ndtl-status-inactive');
    if (!cbActive.checked && !cbInactive.checked) {
      showError('ndtl-status-error', '사용 여부를 선택해 주세요.'); valid = false;
    }

    return valid;
  }

  // ── 점검 이력 렌더 ──
  function renderHistory(rows) {
    var tbody = document.getElementById('ndtl-history-tbody');
    if (!tbody) return;
    tbody.innerHTML = '';
    if (!rows || rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="px-3 py-6 text-center text-slate-400 text-xs">점검 이력이 없습니다.</td></tr>';
      return;
    }
    rows.forEach(function(row) {
      var typeHtml = row.type_code === 'abnormal'
        ? '<span class="font-medium text-red-600">이상</span>'
        : '<span class="text-slate-600">정기</span>';
      var actionHtml = row.status === 'normal'
        ? '<span class="text-slate-400">-</span>'
        : row.has_action
          ? '<span class="text-slate-600">조치 완료</span>'
          : '<span class="font-medium text-red-600">조치 필요</span>';
      var mgrHtml;
      if (row.action && row.action.actor && row.action.actor !== '-') {
        mgrHtml = '<span class="text-slate-600">' + row.action.actor + '</span>';
      } else if (row.status === 'action_required' && !row.has_action) {
        mgrHtml = '<button type="button" class="text-blue-600 hover:underline text-xs ndtl-action-trigger"' +
          ' data-inspection-id="' + row.id + '"' +
          ' data-insp-type="' + (row.type_code || '') + '"' +
          ' data-insp-date="' + (row.date || '') + '"' +
          ' data-insp-inspector="' + (row.inspector || '').replace(/"/g, '&quot;') + '"' +
          ' data-insp-note="' + (row.note || '').replace(/"/g, '&quot;').replace(/\n/g, ' ') + '">' +
          '조치 등록</button>';
      } else {
        mgrHtml = '<span class="text-slate-400">-</span>';
      }
      var tr = document.createElement('tr');
      tr.className = 'border-t border-slate-100';
      tr.innerHTML =
        '<td class="px-3 py-2.5">' + typeHtml + '</td>' +
        '<td class="px-3 py-2.5">' + actionHtml + '</td>' +
        '<td class="px-3 py-2.5 text-slate-600 whitespace-nowrap">' + row.date + '</td>' +
        '<td class="px-3 py-2.5 text-slate-600 whitespace-nowrap">' + row.inspector + '</td>' +
        '<td class="px-3 py-2.5 whitespace-nowrap">' + mgrHtml + '</td>' +
        '<td class="px-3 py-2.5 text-slate-600">' + (row.note || '') + '</td>';
      tbody.appendChild(tr);
    });
    tbody.querySelectorAll('.ndtl-action-trigger').forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (typeof window.openNodeActionRegModal === 'function') {
          window.openNodeActionRegModal(
            this.dataset.inspectionId,
            this.dataset.inspType,
            this.dataset.inspDate,
            this.dataset.inspInspector,
            this.dataset.inspNote,
            _currentData
          );
        }
      });
    });
  }

  // ── 점검 이력 API ──
  function loadInspectionHistory() {
    if (!_currentPk) return;
    fetch('/manager/node/' + _currentPk + '/inspections/')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.ok) return;
        var s = data.summary;
        if (s) {
          var flagEl  = document.getElementById('ndtl-insp-flag');
          var stateEl = document.getElementById('ndtl-insp-state');
          flagEl.textContent  = s.check_status || '—';
          flagEl.className    = 'text-sm font-semibold ' + flagClass(s.check_status);
          stateEl.textContent = s.current_state || '—';
          stateEl.className   = 'text-sm font-semibold ' + stateClass(s.current_state);
          document.getElementById('ndtl-insp-last').textContent = s.last_inspected || '—';
          document.getElementById('ndtl-insp-next').textContent = s.next_inspect   || '—';
        } else {
          ['ndtl-insp-flag','ndtl-insp-last','ndtl-insp-next','ndtl-insp-state'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) { el.textContent = '—'; el.className = 'text-sm font-semibold text-slate-400'; }
          });
        }
        renderHistory(data.inspections || []);
      })
      .catch(function() {});
  }
  window.loadNdInspectionHistory = loadInspectionHistory;

  function flagClass(v) {
    if (v === '점검 필요') return 'text-red-600';
    if (v === '점검 완료') return 'text-emerald-600';
    if (v === '점검 예정') return 'text-amber-600';
    return 'text-slate-400';
  }
  function stateClass(v) {
    if (v === '조치 필요') return 'text-red-600';
    if (v === '정상')      return 'text-emerald-600';
    if (v === '조치 완료') return 'text-emerald-600';
    return 'text-slate-400';
  }

  // ── 탭 ──
  var TAB_ACTIVE   = 'px-4 py-2.5 text-sm font-medium border-b-2 border-blue-600 text-blue-600 -mb-px transition-colors';
  var TAB_INACTIVE = 'px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 -mb-px transition-colors';

  function activateTab(tab) {
    var isBasic = (tab === 'basic');
    document.getElementById('ndtl-tab-basic').className   = isBasic ? TAB_ACTIVE : TAB_INACTIVE;
    document.getElementById('ndtl-tab-inspect').className = isBasic ? TAB_INACTIVE : TAB_ACTIVE;
    document.getElementById('ndtl-panel-basic').classList.toggle('hidden', !isBasic);
    document.getElementById('ndtl-panel-inspect').classList.toggle('hidden', isBasic);
    document.getElementById('ndtl-footer-basic').classList.toggle('hidden', !isBasic);
    document.getElementById('ndtl-footer-inspect').classList.toggle('hidden', isBasic);
    if (!isBasic) loadInspectionHistory();
  }

  document.getElementById('ndtl-tab-basic')?.addEventListener('click',   function() { activateTab('basic'); });
  document.getElementById('ndtl-tab-inspect')?.addEventListener('click', function() { activateTab('inspect'); });

  // ── 모달 열기 ──
  window.openNodeDetailModal = function(data) {
    _currentPk   = data.pk || '';
    _currentData = data;

    // 헤더
    document.getElementById('ndtl-title').textContent = '위치 노드 ' + (data.deviceName || data.deviceCode || '상세');

    // 기본 정보 채우기
    document.getElementById('ndtl-device-type').value          = 'LOC';
    document.getElementById('ndtl-device-code').value          = data.deviceCode  || '';
    document.getElementById('ndtl-device-name').value          = data.deviceName  || '';
    document.getElementById('ndtl-device-mac').value           = data.mac         || '';
    document.getElementById('ndtl-dept').value                 = data.departmentId|| '';
    document.getElementById('ndtl-manager').value              = data.managerId   || '';
    document.getElementById('ndtl-ip').value                   = data.ip          || '';
    document.getElementById('ndtl-port').value                 = data.port        || '';
    document.getElementById('ndtl-status-active').checked      = (data.isActive === 'true');
    document.getElementById('ndtl-status-inactive').checked    = (data.isActive !== 'true');
    document.getElementById('ndtl-note').value                 = data.note        || '';

    // 연결 확인 상태 초기화
    origIp       = data.ip   || '';
    origPort     = data.port || '';
    commChecked  = false;
    var hasLastSeen = !!(data.lastSeen);
    document.getElementById('ndtl-conn-verified').checked = hasLastSeen;
    document.getElementById('ndtl-conn-date').value       = data.lastSeen || '';

    // 점검 탭 요약
    document.getElementById('ndtl-insp-node-code').textContent   = data.deviceCode  || '—';
    document.getElementById('ndtl-insp-device-info').textContent = '위치 노드 · MAC ' + (data.mac || '—');
    document.getElementById('ndtl-insp-manager-name').textContent = data.managerName || '—';
    document.getElementById('ndtl-inspect-register-btn').onclick  = function() {
      if (typeof window.openNodeInspRegModal === 'function') {
        window.openNodeInspRegModal(_currentPk, data.managerName || '—', data.deviceCode || '—', data.mac || '—');
      }
    };
    ['ndtl-insp-flag','ndtl-insp-last','ndtl-insp-next','ndtl-insp-state'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) { el.textContent = '—'; el.className = 'text-sm font-semibold text-slate-400'; }
    });
    var tbody = document.getElementById('ndtl-history-tbody');
    if (tbody) tbody.innerHTML = '';

    clearAllErrors();
    activateTab('basic');

    snapshot = getFormState();
    submitBtn.disabled = true;
    submitBtn.className = 'px-5 py-2 bg-slate-300 text-slate-500 text-sm font-medium rounded-md cursor-not-allowed transition-colors';

    modal.classList.remove('hidden');
    modal.classList.add('flex');
    lucide.createIcons();
  };

  function closeModal() {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  document.getElementById('ndtl-close')?.addEventListener('click', closeModal);
  document.getElementById('ndtl-cancel')?.addEventListener('click', closeModal);
  document.getElementById('ndtl-inspect-close')?.addEventListener('click', closeModal);

  // 저장
  document.getElementById('ndtl-submit')?.addEventListener('click', function() {
    if (this.disabled || !_currentPk) return;
    if (!validate()) return;

    var fd = new FormData();
    fd.append('device_code',  document.getElementById('ndtl-device-code').value.trim());
    fd.append('device_name',  document.getElementById('ndtl-device-name').value.trim());
    fd.append('device_mac',   document.getElementById('ndtl-device-mac').value.trim());
    fd.append('department',   document.getElementById('ndtl-dept').value);
    fd.append('manager',      document.getElementById('ndtl-manager').value);
    fd.append('ip',           document.getElementById('ndtl-ip').value.trim());
    fd.append('port',         document.getElementById('ndtl-port').value.trim());
    fd.append('is_active',    document.getElementById('ndtl-status-active').checked ? 'true' : 'false');
    fd.append('note',         document.getElementById('ndtl-note').value.trim());

    fetch('/manager/node/' + _currentPk + '/edit/', {
      method: 'POST',
      headers: { 'X-CSRFToken': getCsrf() },
      body: fd,
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        closeModal();
        successModal.classList.remove('hidden');
        successModal.classList.add('flex');
        lucide.createIcons();
      } else {
        alert(data.error || '수정에 실패했습니다.');
      }
    })
    .catch(function() { alert('서버 오류가 발생했습니다.'); });
  });

  document.getElementById('ndtl-success-confirm')?.addEventListener('click', function() {
    successModal.classList.add('hidden');
    successModal.classList.remove('flex');
    location.reload();
  });
})();
</script>
