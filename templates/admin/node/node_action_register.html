<!-- Node Action Register Success Modal -->
<div id="nar-success-modal" class="hidden fixed inset-0 bg-slate-900/40 z-[75] items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-sm px-8 py-8 text-center">
    <div class="w-12 h-12 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-4">
      <i data-lucide="check" class="w-6 h-6 text-emerald-600"></i>
    </div>
    <p class="text-base font-semibold text-slate-900 mb-1">저장되었습니다.</p>
    <p class="text-xs text-slate-500 mb-6">조치 정보가 점검 이력에 반영되었습니다.</p>
    <button type="button" id="nar-success-confirm"
      class="w-full px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md transition-colors">확인</button>
  </div>
</div>

<!-- Node Action Register Modal -->
<div id="node-action-reg-modal" class="hidden fixed inset-0 bg-slate-900/40 z-[65] items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-xl max-h-[90vh] overflow-y-auto">

    <!-- Header -->
    <div class="px-8 pt-7 pb-5">
      <h3 class="text-xl font-bold text-slate-900 mb-1">조치 등록</h3>
      <p class="text-xs text-slate-500">후속 조치 정보를 등록합니다.</p>
    </div>

    <div class="px-8 pb-6 space-y-5">

      <!-- 조치 대상 -->
      <div>
        <p class="text-xs font-semibold text-slate-700 mb-2">조치 대상</p>
        <div class="border border-slate-200 rounded-lg px-5 py-4 flex items-start justify-between bg-slate-50">
          <p class="text-base font-bold text-slate-900 mr-6 flex-shrink-0" id="nar-node-id">NODE-001</p>
          <div class="text-right">
            <p class="text-xs text-slate-600" id="nar-device-info">위치 노드 · —</p>
            <p class="text-xs text-slate-500 mt-0.5">담당자 : <span id="nar-manager-name">—</span></p>
          </div>
        </div>
      </div>

      <!-- 점검 기본 정보 (읽기 전용) -->
      <div>
        <p class="text-xs font-semibold text-slate-700 mb-3">점검 기본 정보</p>
        <div class="space-y-3">

          <!-- Row 1: 점검 구분 | 점검일 | 점검자 -->
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1.5">점검 구분</label>
              <input type="text" id="nar-insp-type" disabled
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1.5">점검일</label>
              <input type="text" id="nar-insp-date" disabled
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1.5">점검자</label>
              <input type="text" id="nar-insp-inspector" disabled
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
            </div>
          </div>

          <!-- Row 2: 점검 상태 (조치 완료 고정) -->
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1.5">점검 상태</label>
              <input type="text" value="조치 완료" disabled
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
            </div>
          </div>

          <!-- Row 3: 점검 의견 (읽기 전용) -->
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1.5">점검 의견</label>
            <textarea id="nar-insp-note" rows="3" disabled
              class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed resize-none"></textarea>
          </div>

        </div>
      </div>

      <!-- 조치 정보 (입력) -->
      <div>
        <p class="text-xs font-semibold text-slate-700 mb-3">조치 정보</p>
        <div class="space-y-3">

          <!-- 조치 완료일 | 점검자 -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">조치 완료일</label>
              <input type="text" id="nar-action-date" disabled
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">점검자</label>
              <input type="text" id="nar-action-inspector" disabled
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
            </div>
          </div>

          <!-- 조치 의견 (필수) -->
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1.5">조치 의견 <span class="text-red-500">*</span></label>
            <textarea id="nar-action-note" rows="4" placeholder="조치 내용을 입력해주세요."
              class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400 resize-none"></textarea>
          </div>

        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-2 px-8 py-5 border-t border-slate-100">
      <button type="button" id="nar-cancel"
        class="px-5 py-2 border border-slate-200 bg-white rounded-md text-sm text-slate-700 hover:bg-slate-50 transition-colors">
        취소
      </button>
      <button type="button" id="nar-submit" disabled
        class="px-5 py-2 bg-slate-300 text-slate-500 text-sm font-medium rounded-md cursor-not-allowed transition-colors">
        저장
      </button>
    </div>

  </div>
</div>

<script>
(function() {
  var modal        = document.getElementById('node-action-reg-modal');
  var successModal = document.getElementById('nar-success-modal');
  var submitBtn    = document.getElementById('nar-submit');
  var actionNote   = document.getElementById('nar-action-note');

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '.' +
      String(d.getMonth() + 1).padStart(2, '0') + '.' +
      String(d.getDate()).padStart(2, '0');
  }

  function checkSaveBtn() {
    var ok = !!(actionNote.value.trim());
    submitBtn.disabled = !ok;
    submitBtn.className = ok
      ? 'px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md transition-colors'
      : 'px-5 py-2 bg-slate-300 text-slate-500 text-sm font-medium rounded-md cursor-not-allowed transition-colors';
  }

  actionNote?.addEventListener('input', checkSaveBtn);

  // nodeId, inspectType, inspectDate, inspectorName, inspectNote
  window.openNodeActionRegModal = function(nodeId, inspectType, inspectDate, inspectorName, inspectNote) {
    var data   = (window._ndtlNodeData && window._ndtlNodeData[nodeId]) || {};
    var mgr    = (window._ndtlManagers && window._ndtlManagers[data.manager]) || inspectorName || '—';
    var devId  = data.deviceId || '—';

    document.getElementById('nar-node-id').textContent      = nodeId       || '—';
    document.getElementById('nar-device-info').textContent  = '위치 노드 · ' + devId;
    document.getElementById('nar-manager-name').textContent = mgr;

    // 점검 기본 정보 (읽기 전용)
    document.getElementById('nar-insp-type').value       = inspectType  === 'abnormal' ? '이상 점검' : (inspectType === 'regular' ? '정기 점검' : (inspectType || '—'));
    document.getElementById('nar-insp-date').value       = inspectDate  || '—';
    document.getElementById('nar-insp-inspector').value  = inspectorName || mgr;
    document.getElementById('nar-insp-note').value       = inspectNote  || '';

    // 조치 정보 자동 입력
    document.getElementById('nar-action-date').value      = todayStr();
    document.getElementById('nar-action-inspector').value = mgr;
    actionNote.value = '';
    checkSaveBtn();

    modal.classList.remove('hidden');
    modal.classList.add('flex');
    lucide.createIcons();
  };

  function closeModal() {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  document.getElementById('nar-cancel')?.addEventListener('click', closeModal);

  submitBtn?.addEventListener('click', function() {
    if (this.disabled) return;
    closeModal();
    successModal.classList.remove('hidden');
    successModal.classList.add('flex');
    lucide.createIcons();
  });

  document.getElementById('nar-success-confirm')?.addEventListener('click', function() {
    successModal.classList.add('hidden');
    successModal.classList.remove('flex');
  });
})();
</script>
