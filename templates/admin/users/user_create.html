<div id="register-modal" class="fixed inset-0 bg-slate-900/40 z-50 hidden items-center justify-center p-4">
  <div class="modal-content bg-white rounded-xl shadow-xl w-full max-w-xl max-h-[90vh] overflow-y-auto">
    <div class="px-8 py-7">
      {# 헤더 #}
      <div class="mb-6">
        <h3 class="text-xl font-bold text-slate-900 mb-1">사용자 등록</h3>
        <p class="text-xs text-slate-500">관리자 또는 사용자 계정을 등록합니다.</p>
      </div>

      <form id="user-create-form" method="post" action="{% url 'user_create' %}">
        {% csrf_token %}

        <div class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">
                사용자명 <span class="text-red-500">*</span>
              </label>
              <input type="text" name="name" id="c-name" placeholder="이름을 입력하세요"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400" />
              <p class="field-error hidden mt-1 text-xs text-red-500" id="err-name"></p>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">
                아이디 <span class="text-red-500">*</span>
              </label>
              <input type="text" name="username" id="c-username" placeholder="아이디를 입력하세요"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400" />
              <p class="field-error hidden mt-1 text-xs text-red-500" id="err-username"></p>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">
                비밀번호 <span class="text-red-500">*</span>
              </label>
              <input type="password" name="password1" id="c-pw1" placeholder="비밀번호를 입력하세요"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400" />
              <p class="field-error hidden mt-1 text-xs text-red-500" id="err-pw1"></p>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">
                비밀번호 확인 <span class="text-red-500">*</span>
              </label>
              <input type="password" name="password2" id="c-pw2" placeholder="비밀번호를 다시 입력하세요"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400" />
              <p class="field-error hidden mt-1 text-xs text-red-500" id="err-pw2"></p>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">
                소속 <span class="text-red-500">*</span>
              </label>
              <select name="department" id="c-department" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-400">
                <option value="">소속을 선택하세요</option>
                {% for dept in departments %}
                  <option value="{{ dept.id }}">{{ dept.name }}</option>
                {% endfor %}
              </select>
              <p class="field-error hidden mt-1 text-xs text-red-500" id="err-department"></p>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">
                권한 <span class="text-red-500">*</span>
              </label>
              <select name="user_type" id="c-user-type" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-400">
                <option value="">권한을 선택하세요</option>
                <option value="admin">슈퍼관리자</option>
                <option value="manager">관리자</option>
                <option value="worker">일반사용자</option>
              </select>
              <p class="field-error hidden mt-1 text-xs text-red-500" id="err-user-type"></p>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">직위</label>
              <select name="position" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-400">
                <option value="">직위를 선택하세요</option>
                {% for pos in positions %}
                  <option value="{{ pos.name }}">{{ pos.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">
                계정 상태 <span class="text-red-500">*</span>
              </label>
              <select name="is_active" id="c-is-active" class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-400">
                <option value="">상태를 선택하세요</option>
                <option value="true">사용</option>
                <option value="false">비활성</option>
              </select>
              <p class="field-error hidden mt-1 text-xs text-red-500" id="err-is-active"></p>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">
                이메일 <span class="text-red-500">*</span>
              </label>
              <input type="text" name="email" id="c-email" placeholder="example@company.com"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400" />
              <p class="field-error hidden mt-1 text-xs text-red-500" id="err-email"></p>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">
                연락처 <span class="text-red-500">*</span>
              </label>
              <input type="text" name="phone" id="c-phone" placeholder="010-0000-0000"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400" />
              <p class="field-error hidden mt-1 text-xs text-red-500" id="err-phone"></p>
            </div>
          </div>
        </div>

        <div class="flex items-center justify-end gap-2 mt-6">
          <a href="#" id="register-cancel" class="px-5 py-2 border border-slate-200 bg-white rounded-md text-sm text-slate-700 hover:bg-slate-50 transition-colors">취소</a>
          <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md transition-colors">등록</button>
        </div>
      </form>

<script>
(function () {
  const INPUT_BASE = 'w-full px-3 py-2.5 text-sm border rounded-md focus:outline-none focus:ring-2 focus:border-transparent placeholder-slate-400';
  const INPUT_OK  = INPUT_BASE + ' border-slate-200 focus:ring-blue-500';
  const INPUT_ERR = INPUT_BASE + ' border-red-400 focus:ring-red-400';

  function setError(inputId, errId, msg) {
    const el = document.getElementById(inputId);
    const er = document.getElementById(errId);
    if (!el || !er) return;
    el.className = INPUT_ERR;
    er.textContent = msg;
    er.classList.remove('hidden');
  }

  function clearError(inputId, errId) {
    const el = document.getElementById(inputId);
    const er = document.getElementById(errId);
    if (!el || !er) return;
    el.className = INPUT_OK;
    er.classList.add('hidden');
  }

  function validate() {
    let ok = true;

    // 사용자명
    const name = document.getElementById('c-name').value;
    const nameTrimmed = name.trim();
    if (!nameTrimmed) {
      setError('c-name', 'err-name', '사용자명을 입력해 주세요.'); ok = false;
    } else if (nameTrimmed.length < 2) {
      setError('c-name', 'err-name', '사용자명을 2자 이상 입력해 주세요.'); ok = false;
    } else if (nameTrimmed.length > 20) {
      setError('c-name', 'err-name', '사용자명은 20자 이하로 입력해 주세요.'); ok = false;
    } else if (/[^가-힣a-zA-Z0-9]/.test(nameTrimmed)) {
      setError('c-name', 'err-name', '사용자명은 한글, 영문, 숫자만 입력할 수 있습니다.'); ok = false;
    } else {
      clearError('c-name', 'err-name');
    }

    // 아이디
    const username = document.getElementById('c-username').value;
    if (!username) {
      setError('c-username', 'err-username', '아이디를 입력해 주세요.'); ok = false;
    } else if (/\s/.test(username)) {
      setError('c-username', 'err-username', '아이디에는 공백을 입력할 수 없습니다.'); ok = false;
    } else if (/[^a-zA-Z0-9]/.test(username)) {
      setError('c-username', 'err-username', '아이디는 영문 또는 숫자만 입력할 수 있습니다.'); ok = false;
    } else if (username.length < 4) {
      setError('c-username', 'err-username', '아이디를 4자 이상 입력해 주세요.'); ok = false;
    } else if (username.length > 20) {
      setError('c-username', 'err-username', '아이디는 20자 이하로 입력해 주세요.'); ok = false;
    } else {
      clearError('c-username', 'err-username');
    }
    // 중복 확인은 blur 이벤트에서 비동기로 처리 (아래)

    // 비밀번호
    const pw1 = document.getElementById('c-pw1').value;
    if (!pw1) {
      setError('c-pw1', 'err-pw1', '비밀번호를 입력해 주세요.'); ok = false;
    } else if (/\s/.test(pw1)) {
      setError('c-pw1', 'err-pw1', '비밀번호에는 공백을 입력할 수 없습니다.'); ok = false;
    } else if (pw1.length < 8) {
      setError('c-pw1', 'err-pw1', '비밀번호는 8자 이상 입력해 주세요.'); ok = false;
    } else if (pw1.length > 20) {
      setError('c-pw1', 'err-pw1', '비밀번호는 20자 이하로 입력해 주세요.'); ok = false;
    } else {
      const hasAlpha = /[a-zA-Z]/.test(pw1);
      const hasNum   = /[0-9]/.test(pw1);
      const hasSpc   = /[^a-zA-Z0-9]/.test(pw1);
      if ([hasAlpha, hasNum, hasSpc].filter(Boolean).length < 2) {
        setError('c-pw1', 'err-pw1', '비밀번호는 영문, 숫자, 특수문자 중 2가지 이상을 포함해 주세요.'); ok = false;
      } else {
        clearError('c-pw1', 'err-pw1');
      }
    }

    // 비밀번호 확인
    const pw2 = document.getElementById('c-pw2').value;
    if (!pw2) {
      setError('c-pw2', 'err-pw2', '비밀번호 확인을 입력해 주세요.'); ok = false;
    } else if (pw1 !== pw2) {
      setError('c-pw2', 'err-pw2', '비밀번호가 일치하지 않습니다.'); ok = false;
    } else {
      clearError('c-pw2', 'err-pw2');
    }

    // 소속
    if (!document.getElementById('c-department').value) {
      setError('c-department', 'err-department', '소속을 선택해 주세요.'); ok = false;
    } else {
      clearError('c-department', 'err-department');
    }

    // 권한
    if (!document.getElementById('c-user-type').value) {
      setError('c-user-type', 'err-user-type', '권한을 선택해 주세요.'); ok = false;
    } else {
      clearError('c-user-type', 'err-user-type');
    }

    // 계정 상태
    if (!document.getElementById('c-is-active').value) {
      setError('c-is-active', 'err-is-active', '계정 상태를 선택해 주세요.'); ok = false;
    } else {
      clearError('c-is-active', 'err-is-active');
    }

    // 이메일
    const email = document.getElementById('c-email').value.trim();
    if (email) {
      if (email.length > 100) {
        setError('c-email', 'err-email', '이메일은 100자 이하로 입력해 주세요.'); ok = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setError('c-email', 'err-email', '이메일 형식이 올바르지 않습니다.'); ok = false;
      } else {
        clearError('c-email', 'err-email');
      }
    } else {
      clearError('c-email', 'err-email');
    }

    // 연락처
    const phone = document.getElementById('c-phone').value.trim();
    if (phone) {
      const digitsOnly = phone.replace(/-/g, '');
      if (/[^0-9\-]/.test(phone)) {
        setError('c-phone', 'err-phone', '연락처는 숫자만 입력할 수 있습니다.'); ok = false;
      } else if (!/^01[0-9]/.test(digitsOnly)) {
        setError('c-phone', 'err-phone', '연락처 형식이 올바르지 않습니다.'); ok = false;
      } else if (digitsOnly.length !== 11) {
        setError('c-phone', 'err-phone', '연락처를 정확히 입력해 주세요.'); ok = false;
      } else if (!/^01[0-9]-\d{4}-\d{4}$/.test(phone)) {
        setError('c-phone', 'err-phone', '연락처 형식이 올바르지 않습니다.'); ok = false;
      } else {
        clearError('c-phone', 'err-phone');
      }
    } else {
      clearError('c-phone', 'err-phone');
    }

    return ok;
  }

  // 아이디 중복 확인 (blur 시 비동기)
  let usernameOk = true;
  document.getElementById('c-username').addEventListener('blur', async function () {
    const username = this.value.trim();
    if (!username || /[^a-zA-Z0-9]/.test(username) || username.length < 4 || username.length > 20) return;
    try {
      const res = await fetch(`{% url 'check_username' %}?username=${encodeURIComponent(username)}`);
      const data = await res.json();
      if (data.exists) {
        setError('c-username', 'err-username', '이미 사용 중인 아이디입니다.');
        usernameOk = false;
      } else {
        usernameOk = true;
      }
    } catch (e) {
      usernameOk = true; // 네트워크 오류 시 서버 검증에 위임
    }
  });

  document.getElementById('user-create-form').addEventListener('submit', function (e) {
    if (!validate() || !usernameOk) e.preventDefault();
  });
})();
</script>
    </div>
  </div>
</div>
