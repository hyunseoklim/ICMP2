<script>
window.GAS = window.GAS || {};

GAS.MANAGER_NAMES = {};
GAS.DEVICE_TYPE_LABELS = { GAS: '유해가스 센서', PWR: '스마트 전력 시스템', LOC: '위치 노드' };

GAS.getCsrfToken = function() {
  var name = 'csrftoken';
  var cookies = document.cookie.split(';');
  for (var i = 0; i < cookies.length; i++) {
    var c = cookies[i].trim();
    if (c.startsWith(name + '=')) return decodeURIComponent(c.slice(name.length + 1));
  }
  return '';
};

GAS.todayStr = function() {
  var d = new Date();
  var pad = function(n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate());
};

GAS.resolveManager = function(id) {
  return GAS.MANAGER_NAMES[id] || id || '';
};

GAS.resolveDeviceType = function(code) {
  return GAS.DEVICE_TYPE_LABELS[code] || code || '';
};

GAS.showSuccess = function(msg, sub) {
  var sm = document.getElementById('gas-success-modal');
  if (!sm) return;
  document.getElementById('gas-success-msg').textContent = msg || '등록되었습니다.';
  document.getElementById('gas-success-sub').textContent = sub || '장비가 목록에 추가되었습니다.';
  sm.classList.remove('hidden');
  sm.classList.add('flex');
  lucide.createIcons();
};

GAS.showError = function(msg, sub) {
  var em = document.getElementById('gas-error-modal');
  if (!em) return;
  document.getElementById('gas-error-msg').textContent = msg || '오류가 발생했습니다.';
  document.getElementById('gas-error-sub').textContent = sub || '';
  em.classList.remove('hidden');
  em.classList.add('flex');
  lucide.createIcons();
};

GAS.openModal = function(el) {
  el.classList.remove('hidden');
  el.classList.add('flex');
};

GAS.closeModal = function(el) {
  el.classList.add('hidden');
  el.classList.remove('flex');
};
</script>
