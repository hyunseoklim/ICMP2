<div id="inspect-register-modal" class="hidden fixed inset-0 bg-slate-900/60 z-[60] items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-xl">

    <div class="px-8 py-6 border-b border-slate-100">
      <h3 class="text-lg font-bold text-slate-900">점검 등록</h3>
      <p class="text-xs text-slate-500 mt-1">선택한 유해가스 센서의 정기 점검 결과를 등록합니다.</p>
    </div>

    <div class="px-8 py-6 space-y-5">

      <!-- 점검 대상 -->
      <div>
        <p class="text-xs font-semibold text-slate-700 mb-2">점검 대상</p>
        <div class="px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg">
          <div class="flex items-center gap-2 mb-1">
            <span class="px-2 py-0.5 bg-slate-800 text-white text-xs font-bold rounded" id="ir-sensor-id"></span>
            <span class="text-sm text-slate-700" id="ir-device-info"></span>
          </div>
          <p class="text-xs text-slate-500" id="ir-manager-info"></p>
        </div>
      </div>

      <!-- 점검 기본 정보 -->
      <div>
        <p class="text-xs font-semibold text-slate-700 mb-3">점검 기본 정보</p>
        <form id="inspect-register-form" novalidate class="space-y-4">

          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">점검 구분 <span class="text-red-500">*</span></label>
              <select id="ir-type"
                class="ir-field w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-700">
                <option value="">구분</option>
                <option value="regular">정기 점검</option>
                <option value="abnormal">이상 점검</option>
              </select>
              <p class="hidden mt-1 text-[11px] text-red-500" id="ir-type-error">점검 구분을 선택해 주세요.</p>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">점검일</label>
              <input type="text" id="ir-date" placeholder="YYYY.MM.DD"
                class="ir-field w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400" />
              <p class="hidden mt-1 text-[11px] text-red-500" id="ir-date-error"></p>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">점검자</label>
              <input type="text" id="ir-inspector" placeholder="점검자"
                class="ir-field w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">점검 상태 <span class="text-red-500">*</span></label>
              <select id="ir-status"
                class="ir-field w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-700">
                <option value="">점검 상태</option>
                <option value="normal">정상</option>
                <option value="action_required">조치 필요</option>
              </select>
              <p class="hidden mt-1 text-[11px] text-red-500" id="ir-status-error">점검 상태를 선택해 주세요.</p>
            </div>
            <div id="ir-action-date-wrap" class="hidden">
              <label class="block text-xs font-medium text-slate-700 mb-1.5">예상 조치일 <span class="text-red-500">*</span></label>
              <input type="text" id="ir-action-date" placeholder="YYYY.MM.DD"
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400" />
              <p class="hidden mt-1 text-[11px] text-red-500" id="ir-action-date-error"></p>
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1.5">점검 의견 <span class="text-red-500">*</span></label>
            <textarea id="ir-note" rows="3" placeholder="정기 점검 결과 이상 없음"
              class="ir-field w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400 resize-none"></textarea>
            <p class="hidden mt-1 text-[11px] text-red-500" id="ir-note-error">점검 의견을 입력해 주세요.</p>
          </div>

        </form>
      </div>

    </div>

    <div class="px-8 py-4 border-t border-slate-100 flex justify-end gap-2">
      <button type="button" id="ir-cancel"
        class="px-5 py-2 border border-slate-200 bg-white rounded-md text-sm text-slate-700 hover:bg-slate-50 transition-colors">
        취소
      </button>
      <button type="submit" form="inspect-register-form" id="ir-submit" disabled
        class="px-5 py-2 rounded-md text-sm font-medium transition-colors bg-slate-200 text-slate-400 cursor-not-allowed">
        등록
      </button>
    </div>

  </div>
</div>
<script>
(function() {
  var modal     = document.getElementById('inspect-register-modal');
  var submitBtn = document.getElementById('ir-submit');

  function parseDate(str) {
    var p = str.split('.');
    if (p.length !== 3) return null;
    var y = parseInt(p[0]), m = parseInt(p[1]), d = parseInt(p[2]);
    var dt = new Date(y, m - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() + 1 !== m || dt.getDate() !== d) return null;
    return dt;
  }

  function checkAllFilled() {
    var allFilled = true;
    document.querySelectorAll('#inspect-register-modal .ir-field').forEach(function(f) {
      if (!f.value.trim()) allFilled = false;
    });
    var actionWrap = document.getElementById('ir-action-date-wrap');
    if (actionWrap && !actionWrap.classList.contains('hidden')) {
      if (!document.getElementById('ir-action-date').value.trim()) allFilled = false;
    }
    if (allFilled) {
      submitBtn.disabled = false;
      submitBtn.className = 'px-5 py-2 rounded-md text-sm font-medium transition-colors bg-blue-600 hover:bg-blue-700 text-white cursor-pointer';
    } else {
      submitBtn.disabled = true;
      submitBtn.className = 'px-5 py-2 rounded-md text-sm font-medium transition-colors bg-slate-200 text-slate-400 cursor-not-allowed';
    }
  }

  document.querySelectorAll('#inspect-register-modal .ir-field').forEach(function(f) {
    f.addEventListener('input',  checkAllFilled);
    f.addEventListener('change', checkAllFilled);
  });
  document.getElementById('ir-action-date')?.addEventListener('input', checkAllFilled);

  document.getElementById('ir-status')?.addEventListener('change', function() {
    var wrap = document.getElementById('ir-action-date-wrap');
    if (this.value === 'action_required') {
      wrap.classList.remove('hidden');
    } else {
      wrap.classList.add('hidden');
      document.getElementById('ir-action-date').value = '';
      document.getElementById('ir-action-date-error').classList.add('hidden');
    }
    checkAllFilled();
  });

  function openInspectRegister() {
    var data = window.currentSensorData || {};
    var typeLabel   = GAS.resolveDeviceType(data.deviceType);
    var managerName = data.managerName || GAS.resolveManager(data.manager);

    document.getElementById('ir-sensor-id').textContent   = data.sensorId   || '';
    document.getElementById('ir-device-info').textContent = typeLabel + (data.mac ? ' · MAC ' + data.mac : '');
    document.getElementById('ir-manager-info').textContent = '담당자: ' + managerName;

    document.getElementById('ir-type').value        = '';
    document.getElementById('ir-date').value        = GAS.todayStr();
    document.getElementById('ir-inspector').value   = managerName;
    document.getElementById('ir-status').value      = '';
    document.getElementById('ir-note').value        = '';
    document.getElementById('ir-action-date').value = '';
    document.getElementById('ir-action-date-wrap').classList.add('hidden');

    clearErrors();
    checkAllFilled();

    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }
  window.openInspectRegister = openInspectRegister;

  function closeInspectRegister() {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  function clearErrors() {
    ['ir-type-error', 'ir-date-error', 'ir-status-error', 'ir-action-date-error', 'ir-note-error'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    });
  }
  function showError(errId, msg) {
    var e = document.getElementById(errId);
    if (e) { e.textContent = msg; e.classList.remove('hidden'); }
  }

  document.getElementById('ir-cancel')?.addEventListener('click', closeInspectRegister);

  document.getElementById('inspect-register-form')?.addEventListener('submit', function(e) {
    e.preventDefault();
    clearErrors();
    var valid = true;

    if (!document.getElementById('ir-type').value) {
      showError('ir-type-error', '점검 구분을 선택해 주세요.'); valid = false;
    }
    var dateStr = document.getElementById('ir-date').value.trim();
    var inspectDate = null;
    if (!dateStr) {
      showError('ir-date-error', '점검일을 입력해 주세요.'); valid = false;
    } else {
      inspectDate = parseDate(dateStr);
      if (!inspectDate) {
        showError('ir-date-error', '날짜 형식이 올바르지 않습니다. (YYYY.MM.DD)'); valid = false;
      }
    }
    if (!document.getElementById('ir-status').value) {
      showError('ir-status-error', '점검 상태를 선택해 주세요.'); valid = false;
    }
    var actionWrap = document.getElementById('ir-action-date-wrap');
    if (actionWrap && !actionWrap.classList.contains('hidden')) {
      var actionStr = document.getElementById('ir-action-date').value.trim();
      if (!actionStr) {
        showError('ir-action-date-error', '예상 조치일을 입력해 주세요.'); valid = false;
      } else if (!/^\d{4}\.\d{2}\.\d{2}$/.test(actionStr)) {
        showError('ir-action-date-error', '예상 조치일은 YYYY.MM.DD 형식으로 입력해 주세요.'); valid = false;
      } else {
        var actionDate = parseDate(actionStr);
        if (!actionDate) {
          showError('ir-action-date-error', '올바른 날짜를 입력해 주세요.'); valid = false;
        } else if (inspectDate && actionDate < inspectDate) {
          showError('ir-action-date-error', '예상 조치일은 점검일과 같거나 이후 날짜로 입력해 주세요.'); valid = false;
        }
      }
    }
    if (!document.getElementById('ir-note').value.trim()) {
      showError('ir-note-error', '점검 의견을 입력해 주세요.'); valid = false;
    }
    if (!valid) return;

    var deviceId = window.currentDeviceId;
    if (!deviceId) { alert('장비 정보를 찾을 수 없습니다.'); return; }

    var fd = new FormData();
    fd.append('device_id',           deviceId);
    fd.append('inspect_type',        document.getElementById('ir-type').value);
    fd.append('inspect_date',        document.getElementById('ir-date').value.trim());
    fd.append('inspector',           document.getElementById('ir-inspector').value.trim());
    fd.append('status',              document.getElementById('ir-status').value);
    fd.append('note',                document.getElementById('ir-note').value.trim());
    var actionWrap = document.getElementById('ir-action-date-wrap');
    if (actionWrap && !actionWrap.classList.contains('hidden')) {
      fd.append('expected_action_date', document.getElementById('ir-action-date').value.trim());
    }

    fetch('{% url "gas_inspect_create" %}', {
      method: 'POST',
      headers: { 'X-CSRFToken': GAS.getCsrfToken() },
      body: fd,
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        closeInspectRegister();
        GAS.showSuccess('저장되었습니다.', '점검 결과가 등록되었습니다.');
        if (typeof window.loadInspectionHistory === 'function') window.loadInspectionHistory();
      } else {
        alert(data.error || '등록에 실패했습니다.');
      }
    })
    .catch(function() { alert('서버 오류가 발생했습니다.'); });
  });
})();
</script>
