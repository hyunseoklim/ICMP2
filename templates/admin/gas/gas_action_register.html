<div id="action-register-modal" class="hidden fixed inset-0 bg-slate-900/60 z-[70] items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-xl max-h-[90vh] overflow-y-auto">

    <div class="px-8 py-6 border-b border-slate-100 sticky top-0 bg-white z-10">
      <h3 class="text-lg font-bold text-slate-900">조치 등록</h3>
      <p class="text-xs text-slate-500 mt-1">선택한 유해가스 센서의 조치 결과를 등록합니다.</p>
    </div>

    <div class="px-8 py-6 space-y-5">

      <!-- 조치 대상 -->
      <div>
        <p class="text-xs font-semibold text-slate-700 mb-2">조치 대상</p>
        <div class="px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg">
          <div class="flex items-center gap-2 mb-1">
            <span class="px-2 py-0.5 bg-slate-800 text-white text-xs font-bold rounded" id="ar-sensor-id"></span>
            <span class="text-sm text-slate-700" id="ar-device-info"></span>
          </div>
          <p class="text-xs text-slate-500" id="ar-manager-info"></p>
        </div>
      </div>

      <!-- 점검 기본 정보 (read-only) -->
      <div>
        <p class="text-xs font-semibold text-slate-700 mb-3">점검 기본 정보</p>
        <div class="space-y-4">

          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">점검 구분</label>
              <input type="text" id="ar-inspect-type" disabled
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">점검일</label>
              <input type="text" id="ar-inspect-date" disabled
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">점검자</label>
              <input type="text" id="ar-inspect-person" disabled
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
            </div>
          </div>

          <div class="w-1/3">
            <label class="block text-xs font-medium text-slate-700 mb-1.5">점검 상태</label>
            <input type="text" value="조치 완료" disabled
              class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1.5">점검 의견</label>
            <textarea id="ar-inspect-note" rows="2" disabled
              class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed resize-none"></textarea>
          </div>

        </div>
      </div>

      <!-- 조치 정보 입력 -->
      <div>
        <p class="text-xs font-semibold text-slate-700 mb-3">조치 정보</p>
        <form id="action-register-form" novalidate class="space-y-4">

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">조치 완료일</label>
              <input type="text" id="ar-action-date" disabled
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1.5">점검자</label>
              <input type="text" id="ar-action-person" disabled
                class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-600 cursor-not-allowed" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1.5">조치 의견 <span class="text-red-500">*</span></label>
            <textarea id="ar-action-note" rows="3" placeholder="조치 내용을 입력해 주세요"
              class="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-slate-400 resize-none"></textarea>
            <p class="hidden mt-1 text-[11px] text-red-500" id="ar-note-error">조치 의견을 입력해 주세요.</p>
          </div>

        </form>
      </div>

    </div>

    <div class="px-8 py-4 border-t border-slate-100 flex justify-end gap-2 sticky bottom-0 bg-white">
      <button type="button" id="ar-cancel"
        class="px-5 py-2 border border-slate-200 bg-white rounded-md text-sm text-slate-700 hover:bg-slate-50 transition-colors">
        취소
      </button>
      <button type="submit" form="action-register-form"
        class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md transition-colors">
        등록
      </button>
    </div>

  </div>
</div>
<script>
(function() {
  var modal = document.getElementById('action-register-modal');
  var currentInspectionId = null;

  function openActionRegister(inspectData) {
    var sensor      = window.currentSensorData || {};
    var typeLabel   = GAS.resolveDeviceType(sensor.deviceType);
    var managerName = sensor.managerName || GAS.resolveManager(sensor.manager);

    currentInspectionId = inspectData.id || null;

    document.getElementById('ar-sensor-id').textContent    = sensor.sensorId || '';
    document.getElementById('ar-device-info').textContent  = typeLabel + (sensor.mac ? ' · ' + sensor.mac : '');
    document.getElementById('ar-manager-info').textContent = '담당자: ' + (managerName || '-');

    var TYPE_LABELS = { regular: '정기 점검', abnormal: '이상 점검' };
    document.getElementById('ar-inspect-type').value   = TYPE_LABELS[inspectData.type] || inspectData.type || '';
    document.getElementById('ar-inspect-date').value   = inspectData.date   || '';
    document.getElementById('ar-inspect-person').value = inspectData.person || '';
    document.getElementById('ar-inspect-note').value   = inspectData.note   || '';

    document.getElementById('ar-action-date').value   = GAS.todayStr();
    document.getElementById('ar-action-person').value = '{{ request.user.name }}';
    document.getElementById('ar-action-note').value   = '';
    document.getElementById('ar-note-error').classList.add('hidden');

    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }
  window.openActionRegister = openActionRegister;

  function closeActionRegister() {
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  document.getElementById('ar-cancel')?.addEventListener('click', closeActionRegister);

  document.getElementById('action-register-form')?.addEventListener('submit', function(e) {
    e.preventDefault();

    // 조치 의견 검증
    var note = document.getElementById('ar-action-note').value.trim();
    var noteErr = document.getElementById('ar-note-error');
    if (!note) {
      noteErr.classList.remove('hidden'); return;
    }
    noteErr.classList.add('hidden');

    if (!currentInspectionId) { alert('점검 정보를 찾을 수 없습니다.'); return; }

    var fd = new FormData();
    fd.append('action_date',  document.getElementById('ar-action-date').value.trim());
    fd.append('actor',        document.getElementById('ar-action-person').value.trim());
    fd.append('action_note',  note);

    fetch('/manager/gas/inspect/' + currentInspectionId + '/action/', {
      method: 'POST',
      headers: { 'X-CSRFToken': GAS.getCsrfToken() },
      body: fd,
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        closeActionRegister();
        GAS.showSuccess('저장되었습니다.', '조치 결과가 등록되었습니다.');
        if (typeof window.loadInspectionHistory === 'function') window.loadInspectionHistory();
      } else {
        alert(data.error || '등록에 실패했습니다.');
      }
    })
    .catch(function() { alert('서버 오류가 발생했습니다.'); });
  });
})();
</script>
