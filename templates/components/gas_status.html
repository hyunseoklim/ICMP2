{% load static %}
<div class="widget gas-widget">
    <div class="widget-header">
        <h3>유해가스 위험 현황</h3>
        <div class="sensor-nav">
            <button class="sensor-nav-btn" id="gas-prev">&#8249;</button>
            <span class="sensor-nav-label" id="gas-sensor-name">-</span>
            <button class="sensor-nav-btn" id="gas-next">&#8250;</button>
            <span class="sensor-page" id="gas-page">- / -</span>
        </div>
    </div>

    <div class="table-wrapper">
        <table class="data-table" id="gas-table">
            <thead>
                <tr>
                    <th>가스 종류</th>
                    <th>현재 농도</th>
                    <th>단위</th>
                    <th>위험도</th>
                </tr>
            </thead>
            <tbody id="gas-tbody">
                <tr><td colspan="4" class="text-center">로딩 중...</td></tr>
            </tbody>
        </table>
    </div>
</div>
