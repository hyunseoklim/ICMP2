{% load static %}
<div class="widget event-widget">
    <div class="widget-header">
        <h3>이벤트 현황</h3>
        <a href="{% url 'event_list' %}" class="widget-more-link">+ 상세 보기</a>
    </div>

    <ul class="event-list" id="event-list">
        <li class="event-empty">로딩 중...</li>
    </ul>

    <div class="event-summary">
        <span>최근 24시간</span>
        <span class="event-count-danger">위험 0건</span>
        <span class="event-count-warning">주의 0건</span>
        <span class="event-count-anomaly">AI탐지 0건</span>
    </div>
</div>
