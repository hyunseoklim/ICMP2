{% load static %}
<div class="widget ai-power-widget" id="ai-power-widget">
    <div class="widget-header">
        <h3>AI 예측 — 스마트 전력 시스템 위험</h3>
        <a href="{% url 'monitoring_power' %}" class="widget-more-link">+ 상세 보기</a>
    </div>

    <div class="ai-power-widget__body">
        <div class="ai-power-widget__card">
            <div class="ai-power-widget__card-head">
                <span class="ai-power-widget__channel" id="aipw-channel">-</span>
                <span class="ai-power-widget__device" id="aipw-device">-</span>
                <div class="ai-power-widget__nav">
                    <button type="button" class="ai-power-widget__nav-btn" id="aipw-prev">&#8249;</button>
                    <span class="ai-power-widget__page" id="aipw-page">- / -</span>
                    <button type="button" class="ai-power-widget__nav-btn" id="aipw-next">&#8250;</button>
                </div>
            </div>

            <div class="ai-power-widget__metrics">
                <div class="ai-power-widget__metric">
                    <span class="ai-power-widget__metric-label">현재 값</span>
                    <span class="ai-power-widget__metric-value" id="aipw-current">—</span>
                </div>
                <div class="ai-power-widget__metric-divider"></div>
                <div class="ai-power-widget__metric">
                    <span class="ai-power-widget__metric-label" id="aipw-max-label">최대 예상 값</span>
                    <span class="ai-power-widget__metric-value" id="aipw-max">—</span>
                </div>
            </div>

            <div class="ai-power-widget__chart">
                <canvas id="aipw-chart"></canvas>
            </div>

            <div class="ai-power-widget__dots" id="aipw-dots"></div>
        </div>
    </div>
</div>
