{% load static %}
<div class="widget ai-gas-widget">
    <div class="widget-header">
        <h3>AI 예측 — 유해가스</h3>
        <span class="ai-updated-at" id="ai-gas-updated">-</span>
        <a href="{% url 'monitoring_gas' %}" class="widget-more-link">+ 상세 보기</a>
    </div>

    <!-- 장비 네비게이터 -->
    <div class="ai-nav-row">
        <button class="ai-nav-btn" id="ai-gas-prev">&#8249;</button>
        <span class="ai-nav-label" id="ai-gas-nav-label">-</span>
        <button class="ai-nav-btn" id="ai-gas-next">&#8250;</button>
    </div>

    <!-- 가스 종류 탭 -->
    <div class="ai-gas-tabs" id="ai-gas-tabs"></div>

    <!-- 미니 라인차트 -->
    <div class="ai-chart-wrap">
        <canvas id="ai-gas-mini-chart"></canvas>
    </div>

    <!-- AI 상태 배지 -->
    <div class="ai-badges" id="ai-gas-badges"></div>

    <!-- ARIMA 예측 메시지 -->
    <div id="ai-gas-arima-msg"></div>
</div>

<style>
.ai-nav-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
}
.ai-nav-btn {
    background: var(--bg-panel-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-secondary);
    width: 20px; height: 20px;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
}
.ai-nav-btn:hover { background: var(--bg-panel-3); }
.ai-nav-label { font-size: 11px; color: var(--text-secondary); flex: 1; text-align: center; }
.ai-gas-tabs {
    display: flex; gap: 3px; padding: 0 8px 4px;
    flex-wrap: wrap;
}
.ai-gas-tab {
    font-size: 9px; padding: 2px 6px;
    border-radius: 3px; cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg-panel-2);
    color: var(--text-muted);
}
.ai-gas-tab.active {
    background: rgba(56,189,248,.15);
    border-color: #38bdf8;
    color: #38bdf8;
}
.ai-chart-wrap {
    padding: 4px 8px;
    height: 90px;
    position: relative;
}
.ai-chart-wrap canvas { width: 100% !important; height: 90px !important; }
.ai-badges {
    display: flex; gap: 3px; flex-wrap: wrap;
    padding: 3px 8px;
}
.ai-badge {
    font-size: 9px; padding: 1px 5px;
    border-radius: 3px; font-weight: 500;
}
.ai-badge.normal  { background: rgba(34,197,94,.15); color: #22c55e; border: 1px solid rgba(34,197,94,.3); }
.ai-badge.warning { background: rgba(234,179,8,.15);  color: #eab308; border: 1px solid rgba(234,179,8,.3); }
.ai-badge.danger  { background: rgba(239,68,68,.15);  color: #ef4444; border: 1px solid rgba(239,68,68,.3); }
.ai-badge.muted   { background: rgba(100,116,139,.1); color: var(--text-muted); border: 1px solid var(--border); }
.ai-predict-msg { font-size: 10px; color: #eab308; padding: 2px 8px; }
</style>

<script>
(function () {
    const GAS_TABS  = ['co', 'h2s', 'co2', 'o2', 'no2', 'so2', 'o3', 'nh3', 'voc'];
    const GAS_LABEL = { co:'CO', h2s:'H₂S', co2:'CO₂', o2:'O₂', no2:'NO₂', so2:'SO₂', o3:'O₃', nh3:'NH₃', voc:'VOC' };

    let devices      = [];
    let deviceIdx    = 0;
    let selectedGas  = 'co';
    let miniChart    = null;
    let aiStatusData = null;

    const STATUS_LEVEL = {
        'CRITICAL': 3, 'ISOLATION_ANOMALY': 3, 'CHANGE_POINT_ALERT': 3,
        'ANOMALY_WARNING': 2, 'CHANGE_POINT_WARNING': 2, 'PREDICTIVE_WARNING': 2,
        'NORMAL': 1, 'INSUFFICIENT_DATA': 0,
    };
    function badgeClass(s) {
        const lv = STATUS_LEVEL[s] ?? 0;
        return lv >= 3 ? 'danger' : lv >= 2 ? 'warning' : lv === 1 ? 'normal' : 'muted';
    }

    function buildTabs() {
        const tabEl = document.getElementById('ai-gas-tabs');
        if (!tabEl) return;
        tabEl.innerHTML = GAS_TABS.map(g =>
            `<span class="ai-gas-tab ${g === selectedGas ? 'active' : ''}" data-gas="${g}">${GAS_LABEL[g]}</span>`
        ).join('');
        tabEl.querySelectorAll('.ai-gas-tab').forEach(t => {
            t.addEventListener('click', () => {
                selectedGas = t.dataset.gas;
                buildTabs();
                loadChart();
            });
        });
    }

    async function loadChart() {
        const device = devices[deviceIdx];
        if (!device) return;

        const [histRes, aiRes] = await Promise.all([
            fetch(`/monitoring/api/gas-history/?device_id=${device.id}&limit=30`).then(r => r.json()),
            aiStatusData ? Promise.resolve(aiStatusData) :
                fetch('/monitoring/api/ai-status/').then(r => r.json()),
        ]);
        if (!aiStatusData) aiStatusData = aiRes;

        const history = Array.isArray(histRes) ? histRes : [];
        const histVals   = history.map(r => r[selectedGas] ?? null);
        const histLabels = history.map(r => {
            const t = new Date(r.measured_at);
            return t.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        });

        const deviceAI = (aiRes.devices || []).find(d => d.device_uid === device.device_uid);
        let forecast = null;
        if (deviceAI?.arima?.forecasts?.[selectedGas]) {
            forecast = deviceAI.arima.forecasts[selectedGas];
        }
        const forecastLabels = forecast ? forecast.map((_, i) => `+${i + 1}분`) : [];
        const allLabels = [...histLabels, ...forecastLabels];

        const N = histVals.length;
        const histDataset = [...histVals, ...Array(forecastLabels.length).fill(null)];
        const forecastDataset = forecast && N > 0
            ? [...Array(N - 1).fill(null), histVals[N - 1], ...forecast]
            : null;

        const datasets = [
            { label: '실측', data: histDataset, borderColor: '#38bdf8', borderWidth: 1.5, pointRadius: 0, spanGaps: false, tension: 0.2 },
        ];
        if (forecastDataset) {
            datasets.push({ label: 'AI예측', data: forecastDataset, borderColor: '#f59e0b', borderDash: [4, 3], borderWidth: 1.5, pointRadius: 0, spanGaps: false, tension: 0.2 });
        }

        const ctx = document.getElementById('ai-gas-mini-chart');
        if (!ctx) return;
        if (miniChart) { miniChart.destroy(); miniChart = null; }

        miniChart = new Chart(ctx, {
            type: 'line',
            data: { labels: allLabels, datasets },
            options: {
                responsive: false,
                animation: { duration: 200 },
                plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
                scales: {
                    x: { ticks: { display: false }, grid: { display: false }, border: { display: false } },
                    y: { ticks: { color: '#4b5563', font: { size: 8 }, maxTicksLimit: 4 },
                         grid: { color: 'rgba(255,255,255,0.04)' }, border: { display: false } },
                },
            },
        });

        // AI 배지
        if (deviceAI) {
            const badges = document.getElementById('ai-gas-badges');
            if (badges) {
                const items = [
                    { label: 'Z-score', status: deviceAI.zscore?.status },
                    { label: 'IF', status: deviceAI.isolation?.status },
                    { label: 'ARIMA', status: deviceAI.arima?.status },
                ].map(b => `<span class="ai-badge ${badgeClass(b.status)}">${b.label}</span>`).join('');
                badges.innerHTML = items;
            }
            const arimaEl = document.getElementById('ai-gas-arima-msg');
            if (arimaEl) {
                const msgs = (deviceAI.arima?.predictions || []).map(p =>
                    `<div class="ai-predict-msg">⚠ ${p.metric.toUpperCase()} ${p.first_exceed_step}분 후 초과 예측</div>`
                ).join('');
                arimaEl.innerHTML = msgs;
            }
        }
    }

    function updateNav() {
        const device = devices[deviceIdx];
        const navEl  = document.getElementById('ai-gas-nav-label');
        const updEl  = document.getElementById('ai-gas-updated');
        if (navEl && device) navEl.textContent = `${device.device_uid} (${deviceIdx + 1}/${devices.length})`;
        if (updEl) updEl.textContent = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        buildTabs();
        loadChart();
    }

    async function init() {
        try {
            const res = await fetch('/monitoring/api/devices/?device_type=gas&is_active=true');
            const data = await res.json();
            devices = data.results || data;
            if (!devices.length) return;

            document.getElementById('ai-gas-prev')?.addEventListener('click', () => {
                deviceIdx = (deviceIdx - 1 + devices.length) % devices.length;
                aiStatusData = null;
                updateNav();
            });
            document.getElementById('ai-gas-next')?.addEventListener('click', () => {
                deviceIdx = (deviceIdx + 1) % devices.length;
                aiStatusData = null;
                updateNav();
            });

            updateNav();
            setInterval(() => { aiStatusData = null; updateNav(); }, 60000);
        } catch (e) {
            console.error('AI 가스 위젯 초기화 실패:', e);
        }
    }

    init();
})();
</script>
