{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}산재 예방 통합 관제 시스템{% endblock %}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
<style>
  :root {
    --bg-main: #0f1117;
    --bg-panel: #161b27;
    --bg-card: #1e2435;
    --bg-input: #0f1117;
    --border-color: #2a3142;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #475569;
    --accent-blue: #3b82f6;
    --accent-blue-bg: #1e40af;
    --accent-blue-text: #93c5fd;
    --danger: #ef4444;
    --warning: #f59e0b;
    --success: #22c55e;
    --purple: #a855f7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; background: var(--bg-main); color: var(--text-primary); font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }
  a { color: var(--accent-blue-text); text-decoration: none; }

  /* 상단 네비게이션 */
  .topnav {
    height: 48px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    flex-shrink: 0;
    position: relative;
    z-index: 100;
  }
  .topnav .logo-box {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-blue-text);
    letter-spacing: 1px;
  }
  .topnav .sys-title { font-size: 14px; font-weight: 500; }
  .topnav .user-info { font-size: 12px; color: var(--text-secondary); margin-left: 6px; }
  .topnav .time-info { font-size: 11px; color: var(--text-muted); margin-left: auto; text-align: right; line-height: 1.4; }

  /* 공통 셀렉트 */
  select.dark-select {
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    color: var(--text-primary);
    font-size: 12px;
    padding: 3px 6px;
    width: 100%;
  }
  select.dark-select:focus { outline: none; border-color: var(--accent-blue); }

  /* 공통 버튼 */
  .btn-dark-primary {
    background: var(--accent-blue-bg);
    border: none;
    color: var(--accent-blue-text);
    border-radius: 4px;
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .btn-dark-primary:hover { background: #1d4ed8; }
  .btn-dark-outline {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    border-radius: 4px;
    font-size: 12px;
    padding: 4px 8px;
    cursor: pointer;
  }
  .btn-dark-outline:hover { border-color: var(--accent-blue); color: var(--text-primary); }

  /* 배지 */
  .badge-danger { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); border-radius: 4px; padding: 2px 8px; font-size: 11px; }
  .badge-warning { background: rgba(245,158,11,0.15); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); border-radius: 4px; padding: 2px 8px; font-size: 11px; }
  .badge-success { background: rgba(34,197,94,0.15); color: #86efac; border: 1px solid rgba(34,197,94,0.3); border-radius: 4px; padding: 2px 8px; font-size: 11px; }
  .badge-info { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); border-radius: 4px; padding: 2px 8px; font-size: 11px; }

  /* 토글 스위치 */
  .layer-toggle { position: relative; display: inline-block; width: 32px; height: 18px; }
  .layer-toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; cursor: pointer; inset: 0;
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: 18px; transition: background 0.2s;
  }
  .toggle-slider::before {
    content: ''; position: absolute;
    width: 12px; height: 12px; left: 2px; top: 2px;
    background: var(--text-muted); border-radius: 50%; transition: transform 0.2s, background 0.2s;
  }
  .layer-toggle input:checked + .toggle-slider { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.5); }
  .layer-toggle input:checked + .toggle-slider::before { transform: translateX(14px); background: var(--success); }

  /* 패널 공통 */
  .panel-section {
    background: var(--bg-card);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .panel-label {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 8px;
  }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<div class="topnav">
  <div class="logo-box">IXI</div>
  <div class="sys-title">산재 예방 통합 관제 시스템</div>
  <div class="user-info">홍길동 님 &nbsp;환영합니다.</div>
  <div class="time-info">
    <div>현재 시스템 시간 : <span id="sys-time">-</span></div>
    <div>마지막 갱신 시간 : <span id="last-refresh">-</span></div>
  </div>
  <a href="{% url 'monitoring' %}" style="margin-left:12px;font-size:18px;color:var(--text-secondary)">&#8962;</a>
  <button class="btn-dark-outline" style="margin-left:8px">로그아웃</button>
</div>

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script>
  function updateClock() {
    const now = new Date();
    const fmt = now.toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
    document.getElementById('sys-time').textContent = fmt;
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
