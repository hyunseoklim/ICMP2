{% extends "base.html" %}
{% load static %}

{% block title %}대시보드 — 산재 예방 통합 관제시스템{% endblock %}

{# 대시보드는 base의 모든 컴포넌트를 그대로 표시 — 블록 override 없음 #}

{% block script %}
<script>
  window.SAFETY_DONE         = {{ safety_done|yesno:"true,false" }};
  window.VR_DONE             = {{ vr_done|yesno:"true,false" }};
  window.CURRENT_WORKER_ID   = {{ current_worker_id|default:"null" }};
  window.CURRENT_WORKER_NAME = "{{ current_worker_name|default:'' }}";
</script>
<script src="{% static 'js/dashboard.js' %}"></script>
{% endblock %}
