version: "3.9"

services:

  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    build: .
    container_name: django
    volumes:
      - .:/app
      - prometheus_multiproc:/tmp/prometheus_multiproc
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: fastapi
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_healthy
      redis:
        condition: service_healthy


  celery:
    build: .
    container_name: celery
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
      - prometheus_multiproc:/tmp/prometheus_multiproc
    env_file:
      - .env
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started

  celery-beat:
    build: .
    container_name: celery-beat
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
      - prometheus_multiproc:/tmp/prometheus_multiproc
    env_file:
      - .env
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started

  celery-events:
    build: .
    container_name: celery-events
    command: celery -A config worker -Q events --concurrency=1 --loglevel=info
    volumes:
      - .:/app
      - prometheus_multiproc:/tmp/prometheus_multiproc
    env_file:
      - .env
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started


  gas-stream-consumer:
    build: .
    container_name: gas-stream-consumer
    command: python manage.py consume_gas_stream
    volumes:
      - .:/app
      - prometheus_multiproc:/tmp/prometheus_multiproc
    env_file:
      - .env
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started


  power-stream-consumer:
    build: .
    container_name: power-stream-consumer
    command: python manage.py consume_power_stream
    volumes:
      - .:/app
      - prometheus_multiproc:/tmp/prometheus_multiproc
    env_file:
      - .env
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started


  gas-result-consumer:
    build: .
    container_name: gas-result-consumer
    command: python manage.py consume_gas_result
    volumes:
      - .:/app
      - prometheus_multiproc:/tmp/prometheus_multiproc
    env_file:
      - .env
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started

  power-result-consumer:
    build: .
    container_name: power-result-consumer
    command: python manage.py consume_power_result
    volumes:
      - .:/app
      - prometheus_multiproc:/tmp/prometheus_multiproc
    env_file:
      - .env
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started

  ai-engine-gas:
    build:
      context: ./fastapi_app/ai_engine
      dockerfile: Dockerfile.ai
    container_name: ai-engine-gas
    environment:
      AI_DOMAIN: gas
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy

  ai-engine-power:
    build:
      context: ./fastapi_app/ai_engine
      dockerfile: Dockerfile.ai
    container_name: ai-engine-power
    environment:
      AI_DOMAIN: power
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8003:8002"
    depends_on:
      redis:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    depends_on:
      django:
        condition: service_started
      fastapi:
        condition: service_started
      redis-exporter:
        condition: service_started
      postgres-exporter:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    env_file:
      - .env
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  db_data:
  redis_data:
  grafana_data:
  prometheus_multiproc: