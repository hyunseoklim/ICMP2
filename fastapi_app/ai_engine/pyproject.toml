[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engine"
version = "0.1.0"
description = "위험 판단 AI 엔진 — Phase 4 검증 환경 (fastapi_app/ai_engine 내부)"
requires-python = ">=3.11"
authors = [
    {name = "Phase 4 작업팀"}
]

dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10,<2.0",
    "scikit-learn>=1.3,<2.0",
    "statsmodels>=0.14,<1.0",
    "ruptures>=1.1.7,<2.0",
    "joblib>=1.3,<2.0",
    "PyYAML>=6.0,<7.0",
    "pandas>=2.0,<3.0",
    "pyarrow>=14.0,<16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
]

[tool.setuptools]
packages = ["common", "gas", "power", "generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["common", "gas", "power", "generator"]
omit = ["tests/*", "scripts/*"]
