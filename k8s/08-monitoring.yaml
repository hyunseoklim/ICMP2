# ── Grafana Provisioning ConfigMaps ───────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-datasources
  namespace: icmp2
data:
  prometheus.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
        access: proxy
        editable: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-dashboards
  namespace: icmp2
data:
  dashboard.yml: |
    apiVersion: 1

    providers:
      - name: default
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards
  main.json: |
    {
      "title": "ICMP2 모니터링",
      "uid": "icmp2-main",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "15s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "서비스 상태",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 3
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                },
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "up{job=\"django\"}",
              "legendFormat": "Django",
              "datasource": {
                "type": "prometheus",
                "uid": "PBFA97CFB590B2093"
              }
            },
            {
              "expr": "up{job=\"fastapi\"}",
              "legendFormat": "FastAPI",
              "datasource": {
                "type": "prometheus",
                "uid": "PBFA97CFB590B2093"
              }
            },
            {
              "expr": "up{job=\"redis\"}",
              "legendFormat": "Redis",
              "datasource": {
                "type": "prometheus",
                "uid": "PBFA97CFB590B2093"
              }
            },
            {
              "expr": "up{job=\"postgres\"}",
              "legendFormat": "PostgreSQL",
              "datasource": {
                "type": "prometheus",
                "uid": "PBFA97CFB590B2093"
              }
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          }
        },
        {
          "id": 2,
          "title": "Django RPS (초당 요청 수)",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 12,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "tooltip": {
              "mode": "single"
            },
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(django_http_requests_total_by_view_transport_method_total[1m]))",
              "legendFormat": "RPS",
              "datasource": {
                "type": "prometheus",
                "uid": "PBFA97CFB590B2093"
              }
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          }
        },
        {
          "id": 3,
          "title": "Django p95 응답시간",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 3,
            "w": 12,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.5
                  },
                  {
                    "color": "red",
                    "value": 1.0
