# ── Grafana PVC ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: icmp2
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi

---
# ── Redis Exporter ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: icmp2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:latest
          env:
            - name: REDIS_ADDR
              value: "redis://redis:6379"
          ports:
            - containerPort: 9121

---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: icmp2
spec:
  selector:
    app: redis-exporter
  ports:
    - port: 9121
      targetPort: 9121

---
# ── Postgres Exporter ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: icmp2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:latest
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: icmp2-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: icmp2-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: icmp2-config
                  key: DB_NAME
            - name: DATA_SOURCE_NAME
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)?sslmode=disable"
          ports:
            - containerPort: 9187

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: icmp2
spec:
  selector:
    app: postgres-exporter
  ports:
    - port: 9187
      targetPort: 9187

---
# ── Alertmanager ──────────────────────────────────────────────────────────────
# webhook URL은 icmp2-secret의 ALERTMANAGER_DISCORD_WEBHOOK_URL을 init container가 주입
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config-template
  namespace: icmp2
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: discord
    receivers:
      - name: discord
        discord_configs:
          - webhook_url: __DISCORD_WEBHOOK_URL__
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.service }} 시스템 알림'
            message: |
              {{ range .Alerts }}
              **{{ .Annotations.summary }}**
              {{ .Annotations.description }}
              심각도: {{ .Labels.severity }}
              시각: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
              {{ end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: icmp2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      initContainers:
        - name: init-config
          image: alpine:3.19
          command: ["/bin/sh", "-c"]
          args:
            - |
              WEBHOOK="${ALERTMANAGER_DISCORD_WEBHOOK_URL:-}"
              sed "s|__DISCORD_WEBHOOK_URL__|${WEBHOOK}|g" \
                /template/alertmanager.yml > /config/alertmanager.yml
              echo "alertmanager config generated"
          env:
            - name: ALERTMANAGER_DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: icmp2-secret
                  key: ALERTMANAGER_DISCORD_WEBHOOK_URL
          volumeMounts:
            - name: config-template
              mountPath: /template
            - name: config
              mountPath: /config
      containers:
        - name: alertmanager
          image: prom/alertmanager:latest
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
      volumes:
        - name: config-template
          configMap:
            name: alertmanager-config-template
        - name: config
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: icmp2
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093

---
# ── Prometheus ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: icmp2
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']
    rule_files:
      - /etc/prometheus/alert_rules.yml
    scrape_configs:
      - job_name: django
        static_configs:
          - targets: ['django:8000']
        metrics_path: /metrics
      - job_name: fastapi
        static_configs:
          - targets: ['fastapi:8001']
        metrics_path: /metrics
      - job_name: redis
        static_configs:
          - targets: ['redis-exporter:9121']
      - job_name: postgres
        static_configs:
          - targets: ['postgres-exporter:9187']
  alert_rules.yml: |
    groups:
      - name: django-alerts
        rules:
          - alert: DjangoHighP95Warning
            expr: |
              histogram_quantile(
                0.95,
                sum(rate(django_http_requests_latency_seconds_by_view_method_bucket[1m])) by (le)
              ) > 0.5
            for: 2m
            labels:
              severity: warning
              service: django
            annotations:
              summary: "Django p95 응답 지연 경고"
              description: "Django p95 응답시간이 0.5초를 초과했습니다. (20명 부하 수준)"

          - alert: DjangoHighP95Critical
            expr: |
              histogram_quantile(
                0.95,
                sum(rate(django_http_requests_latency_seconds_by_view_method_bucket[1m])) by (le)
              ) > 1.5
            for: 3m
            labels:
              severity: critical
              service: django
            annotations:
              summary: "Django p95 응답 지연 심각"
              description: "Django p95 응답시간이 1.5초를 초과했습니다. (50명 부하 수준)"

          - alert: DjangoHighErrorRate
            expr: |
              (
                sum(rate(django_http_responses_total_by_status_view_method_total{status=~"5.."}[5m]))
              )
              /
              clamp_min(sum(rate(django_http_responses_total_by_status_view_method_total[5m])), 1e-9)
              > 0.05
            for: 2m
            labels:
              severity: critical
              service: django
            annotations:
              summary: "Django 5xx 에러율 급증"
              description: "Django 5xx 에러율이 5%를 초과했습니다."

          - alert: DjangoDown
            expr: up{job="django"} == 0
            for: 1m
            labels:
              severity: critical
              service: django
            annotations:
              summary: "Django 서버 다운"
              description: "Django 서버에 연결할 수 없습니다."

          - alert: AIForecastSlow
            expr: |
              histogram_quantile(
                0.95,
                sum(rate(icmp2_ai_forecast_duration_seconds_bucket[5m])) by (le, task_type)
              ) > 10
            for: 3m
            labels:
              severity: warning
              service: django
            annotations:
              summary: "AI 예측 처리 지연"
              description: "ARIMA 예측 p95가 10초를 초과했습니다."

      - name: fastapi-alerts
        rules:
          - alert: FastAPIHighP95
            expr: |
              histogram_quantile(
                0.95,
                sum(rate(http_request_duration_seconds_bucket{app_name="fastapi"}[1m])) by (le)
              ) > 1.0
            for: 2m
            labels:
              severity: warning
              service: fastapi
            annotations:
              summary: "FastAPI p95 응답 지연 경고"
              description: "FastAPI p95 응답시간이 1.0초를 초과했습니다."

          - alert: FastAPIDown
            expr: up{job="fastapi"} == 0
            for: 1m
            labels:
              severity: critical
              service: fastapi
            annotations:
              summary: "FastAPI 서버 다운"
              description: "FastAPI 서버에 연결할 수 없습니다."

      - name: infrastructure-alerts
        rules:
          - alert: RedisDown
            expr: up{job="redis"} == 0
            for: 1m
            labels:
              severity: critical
              service: redis
            annotations:
              summary: "Redis 서버 다운"
              description: "Redis 서버에 연결할 수 없습니다."

      - name: test-alerts
        rules:
          - alert: AlwaysFiringTest
            expr: vector(1)
            for: 10s
            labels:
              severity: warning
              service: test
            annotations:
              summary: "Discord 연동 테스트 알림"
              description: "이 알림은 Discord 연동 확인용입니다. 확인 후 삭제하세요."

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: icmp2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: icmp2
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090

---
# ── Grafana ───────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: icmp2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: icmp2
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
