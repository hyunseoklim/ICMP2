groups:
  - name: application-alerts
    rules:
      - alert: DjangoHighP95Warning
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(django_http_request_duration_seconds_bucket[1m])) by (le)
          ) > 0.5
        for: 2m
        labels:
          severity: warning
          service: django
        annotations:
          summary: "Django p95 응답 지연 경고"
          description: "Django p95 응답시간이 0.5초를 초과했습니다."

      - alert: DjangoHighP95Critical
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(django_http_request_duration_seconds_bucket[1m])) by (le)
          ) > 1.0
        for: 3m
        labels:
          severity: critical
          service: django
        annotations:
          summary: "Django p95 응답 지연 심각"
          description: "Django p95 응답시간이 1.0초를 초과했습니다."

      - alert: DjangoHighErrorRate
        expr: |
          (
            sum(rate(django_http_responses_total_by_status_view_method_total{status=~"5.."}[5m]))
          )
          /
          clamp_min(sum(rate(django_http_responses_total_by_status_view_method_total[5m])), 1e-9)
          > 0.05
        for: 2m
        labels:
          severity: critical
          service: django
        annotations:
          summary: "Django 5xx 에러율 급증"
          description: "Django 5xx 에러율이 5%를 초과했습니다."

      - alert: DjangoDown
        expr: up{job="django"} == 0
        for: 1m
        labels:
          severity: critical
          service: django
        annotations:
          summary: "Django 서버 다운"
          description: "Django 서버에 연결할 수 없습니다."

      - alert: FastAPIHighP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket{app_name="fastapi"}[1m])) by (le)
          ) > 1.0
        for: 2m
        labels:
          severity: warning
          service: fastapi
        annotations:
          summary: "FastAPI p95 응답 지연 경고"
          description: "FastAPI p95 응답시간이 1.0초를 초과했습니다."

      - alert: FastAPIDown
        expr: up{job="fastapi"} == 0
        for: 1m
        labels:
          severity: critical
          service: fastapi
        annotations:
          summary: "FastAPI 서버 다운"
          description: "FastAPI 서버에 연결할 수 없습니다."

  - name: worker-alerts
    rules:
      - alert: CeleryDown
        expr: up{job="celery"} == 0
        for: 1m
        labels:
          severity: critical
          service: celery
        annotations:
          summary: "Celery exporter 다운"
          description: "Celery exporter에 연결할 수 없습니다."

      - alert: CeleryHighTaskFailureRate
        expr: |
          (
            sum(rate(celery_tasks_total{state="FAILURE"}[5m])) or vector(0)
          )
          /
          clamp_min(sum(rate(celery_tasks_total[5m])), 1e-9)
          > 0.1
        for: 2m
        labels:
          severity: warning
          service: celery
        annotations:
          summary: "Celery 작업 실패율 높음"
          description: "Celery 작업 실패율이 10%를 초과했습니다."

      - alert: CeleryQueueBacklog
        expr: sum(celery_queue_length) > 50
        for: 3m
        labels:
          severity: warning
          service: celery
        annotations:
          summary: "Celery 큐 적체"
          description: "Celery 큐에 처리되지 않은 작업이 50개를 초과했습니다."

  - name: infrastructure-alerts
    rules:
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis 서버 다운"
          description: "Redis 서버에 연결할 수 없습니다."

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "PostgreSQL 서버 다운"
          description: "PostgreSQL 서버에 연결할 수 없습니다."
